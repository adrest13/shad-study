const EXTENDED_LESSONS={"2026-10-27":{"theory":"Цепное правило: производная композиции равна производной внешней функции в аргументе g(x), умноженной на g′(x). Для произведения независимо применяй (uv)′=u′v+uv′. Геометрический смысл f′(a) — наклон касательной.","worked":"f(x)=sin(x²): внешняя функция sin(u), внутренняя x²; f′(x)=cos(x²)·2x. Касательная в a задаётся y=f(a)+f′(a)(x−a).","practice":[{"q":"Найди производную f(x)=e^(3x)·sin(x²).","hint":"Используй произведение, затем дифференцируй каждую композицию.","solution":"f′(x)=e^(3x)[3sin(x²)+2x cos(x²)].","level":"Средняя"},{"q":"Найди касательную к y=ln(1+x²) в точке x=1.","hint":"Сначала найди значение функции и f′(1).","solution":"f(1)=ln 2, f′(x)=2x/(1+x²), f′(1)=1. Поэтому y=ln 2+x−1.","level":"С доказательством"}]},"2026-10-28":{"theory":"Метод Гаусса заменяет систему эквивалентной ступенчатой формой с помощью перестановки строк, умножения строки на ненулевое число и прибавления кратной другой строки. Число ненулевых строк в ступенчатом виде равно рангу.","worked":"В системе x+y=3, 2x−y=0 прибавь подходящую кратную первого уравнения ко второму: 3x=3, поэтому x=1, y=2.","practice":[{"q":"Реши систему x+2y+z=4; 2x+5y+3z=10; x+3y+2z=6.","hint":"Вычти удвоенную первую строку из второй, а первую — из третьей.","solution":"Обе новые строки дают y+z=2. Пусть z=t, тогда y=2−t, x=t. Бесконечно много решений: (t,2−t,t).","level":"Средняя"},{"q":"Определи ранг матрицы [[1,2,1],[2,4,2],[1,0,1]].","hint":"Вторая строка вдвое больше первой; сравни первую и третью.","solution":"Вторая строка зависима; первая и третья независимы. Ранг равен 2.","level":"С доказательством"}]},"2026-10-29":{"theory":"Для поиска экстремумов вычисли производную, отметь критические точки и интервалы, на которых знак производной постоянен. Переход + → − означает локальный максимум, − → + — минимум. Равенство f′=0 само по себе не гарантирует экстремум.","worked":"Для f(x)=x³−3x: f′=3(x−1)(x+1). Знаки: плюс при x<−1, минус на (−1,1), плюс при x>1. Максимум в −1, минимум в 1.","practice":[{"q":"Исследуй f(x)=x³−6x²+9x: монотонность и локальные экстремумы.","hint":"Вынеси общий множитель в f′(x)=3x²−12x+9.","solution":"f′=3(x−1)(x−3). Возрастает (−∞,1) и (3,∞), убывает (1,3). Максимум f(1)=4, минимум f(3)=0.","level":"Средняя"},{"q":"Докажи, что x−1≥ln x для x>0.","hint":"Проверь минимум функции h(x)=x−1−ln x.","solution":"h′(x)=1−1/x; она убывает на (0,1) и растёт на (1,∞); h(1)=0. Значит h≥0.","level":"С доказательством"}]},"2026-10-30":{"theory":"Правило произведения применяется к последовательным независимым выборам, правило суммы — к непересекающимся случаям. Сочетания C(n,k)=n!/(k!(n−k)!) считают выбор без порядка.","worked":"Выбрать трёх студентов из десяти можно C(10,3)=120 способами; порядок выбранных не важен.","practice":[{"q":"Сколько пятизначных строк из цифр 0–9 содержат ровно две цифры 7?","hint":"Выбери две позиции семёрок, остальные заполнены одной из девяти других цифр.","solution":"C(5,2)·9³ = 10·729 = 7290. Ведущие нули допустимы, так как речь о строках.","level":"Средняя"},{"q":"Сколько трёхзначных чисел имеют попарно разные цифры?","hint":"Первая цифра не равна нулю. После каждого выбора вариантов становится меньше.","solution":"9 вариантов для сотен, 9 для десятков (включая 0, кроме первой цифры), 8 для единиц. Итого 648.","level":"С доказательством"}]},"2026-11-01":{"theory":"Практикум соединяет анализ и алгебру. Сначала самостоятельно распознай тип задачи, а потом подбери инструмент: цепное правило, производная для экстремума, Гаусс для систем.","worked":"Для f(x)=x² e^x: f′=e^x(x²+2x). Для матрицы [[1,2],[2,4]] ранг 1, так как вторая строка удвоенная первая.","practice":[{"q":"Найди все стационарные точки f(x)=x²e^(−x).","hint":"Вынеси e^(−x) из производной; экспонента строго положительна.","solution":"f′=e^(−x)(2x−x²)=e^(−x)x(2−x). Стационарные точки 0 и 2.","level":"Средняя"},{"q":"Реши систему x+y+z=3; x−y+z=1; 2x+2z=4.","hint":"Сложи и вычти первые два уравнения; третье может оказаться зависимым.","solution":"Из первых двух y=1, x+z=2. Третье не добавляет ограничений. Решения (t,1,2−t).","level":"С доказательством"}]},"2026-11-03":{"theory":"Теорема Ролля: если f непрерывна на [a,b], дифференцируема на (a,b), а f(a)=f(b), найдётся c внутри интервала с f′(c)=0. Проверка всех трёх условий обязательна.","worked":"f(x)=x²−4x на [0,4]: f(0)=f(4)=0 и f′=2x−4. Подходит c=2.","practice":[{"q":"Найди точку Ролля для f(x)=x²−6x+5 на [1,5].","hint":"Проверь значения на концах и реши f′(c)=0.","solution":"f(1)=f(5)=0. f′=2x−6, поэтому c=3∈(1,5).","level":"Средняя"},{"q":"Можно ли применить Ролля к f(x)=|x| на [−1,1]?","hint":"Равенство концов есть, но проверь дифференцируемость внутри.","solution":"Нельзя: в x=0 функция недифференцируема; действительно нет внутренней точки, где f′=0.","level":"С доказательством"}]},"2026-11-04":{"theory":"Для квадратной матрицы A обратимость равносильна det A ≠ 0 и полному рангу. Определитель треугольной матрицы равен произведению диагональных элементов; при перестановке строк он меняет знак.","worked":"Для [[a,b],[c,d]] определитель ad−bc. При ненулевом определителе обратная матрица равна (1/(ad−bc))[[d,−b],[−c,a]].","practice":[{"q":"Найди обратную матрицу A=[[2,1],[1,1]].","hint":"Определи det A и используй формулу для матриц 2×2.","solution":"det A=1, A^(−1)=[[1,−1],[−1,2]]. Проверь AA^(−1)=I.","level":"Средняя"},{"q":"При каких a матрица [[a,2],[3,a]] необратима?","hint":"Необратимость равносильна нулю определителя.","solution":"det=a²−6=0, то есть a=±√6.","level":"С доказательством"}]},"2026-11-05":{"theory":"Теорема Лагранжа (о среднем значении): если функция непрерывна на [a,b] и дифференцируема на (a,b), существует c∈(a,b) с f′(c)=(f(b)−f(a))/(b−a). Геометрически касательная параллельна секущей.","worked":"Для f(x)=x² на [1,3] наклон секущей (9−1)/(3−1)=4, а f′(c)=2c; значит c=2.","practice":[{"q":"Найди c из теоремы Лагранжа для f(x)=x³ на [0,2].","hint":"Найди средний наклон и приравняй его к 3c².","solution":"Наклон (8−0)/2=4. Тогда 3c²=4 и c=2/√3∈(0,2).","level":"Средняя"},{"q":"Используя Лагранжа, докажи |sin b−sin a|≤|b−a|.","hint":"Производная sin x равна cos x; её модуль не превосходит 1.","solution":"По теореме sin b−sin a=cos c·(b−a); модуль ≤|b−a|.","level":"С доказательством"}]},"2026-11-06":{"theory":"Размещения считают упорядоченный выбор: A(n,k)=n!/(n−k)!. Сочетания считают неупорядоченный выбор. Различай повторения и отсутствие повторений, это меняет формулу.","worked":"Выбрать президента, заместителя и секретаря из 8 человек можно 8·7·6=336 способами, роли различны.","practice":[{"q":"Сколько четырёхбуквенных кодов без повторений можно составить из 7 различных символов?","hint":"Каждая следующая позиция имеет на один вариант меньше.","solution":"7·6·5·4 = 840.","level":"Средняя"},{"q":"Сколькими способами можно разделить 8 различных книг на два набора по 4, если наборы не подписаны?","hint":"Сначала выбери 4 книги, затем учти двойной подсчёт из-за обмена наборов.","solution":"C(8,4)/2=70/2=35.","level":"С доказательством"}]},"2026-11-08":{"theory":"На пробнике оценивай не только ответ, но и строгость доказательства, проверку условий теорем и полноту решения. Последовательно решай одну задачу анализа, одну алгебры и одну комбинаторики.","worked":"Лагранж помогает оценить разность значений функции через максимум |f′|; определитель помогает проверить обратимость системы.","practice":[{"q":"Докажи |arctan b−arctan a|≤|b−a|.","hint":"Используй Лагранжа и производную 1/(1+x²).","solution":"По Лагранжу разность равна (b−a)/(1+c²), поэтому модуль ≤|b−a|.","level":"Средняя"},{"q":"Найди det [[1,2,0],[0,3,1],[0,0,−2]].","hint":"Треугольная матрица: произведение диагонали.","solution":"det=1·3·(−2)=−6.","level":"С доказательством"}]},"2026-11-10":{"theory":"Формула Тейлора приближает гладкую функцию многочленом около точки a. Многочлен степени n: P_n(x)=Σ(k=0..n) f^(k)(a)(x−a)^k/k!. Чем ближе x к a, тем обычно точнее приближение.","worked":"Для e^x около 0: P_2(x)=1+x+x²/2. Для sin x: P_3(x)=x−x³/6.","practice":[{"q":"Найди многочлен Маклорена степени 3 для e^(2x).","hint":"Подставь 2x в ряд e^u=1+u+u²/2+u³/6+…","solution":"1+2x+2x²+(4/3)x³.","level":"Средняя"},{"q":"Найди многочлен Маклорена степени 4 для cos x.","hint":"Вспомни, что нечётные производные cos в 0 равны 0.","solution":"1−x²/2+x⁴/24.","level":"С доказательством"}]},"2026-11-11":{"theory":"Векторы линейно независимы, если из Σα_i v_i=0 следует α_i=0. Базис — линейно независимая система, порождающая всё пространство. Количество векторов в базисе равно размерности пространства.","worked":"В R² векторы (1,0) и (1,1) образуют базис: определитель соответствующей матрицы равен 1 ≠ 0.","practice":[{"q":"Проверь, образуют ли (1,2) и (2,4) базис R².","hint":"Сравни векторы и вычисли определитель.","solution":"Нет: второй вектор равен удвоенному первому, определитель 0.","level":"Средняя"},{"q":"Найди базис линейной оболочки (1,0,1), (0,1,1), (1,1,2).","hint":"Вырази третий вектор через первые два.","solution":"Третий равен сумме первых двух. Базис: {(1,0,1),(0,1,1)}, размерность 2.","level":"С доказательством"}]},"2026-11-12":{"theory":"Остаток Тейлора в форме Лагранжа: R_n(x)=f^(n+1)(ξ)(x−a)^(n+1)/(n+1)! для некоторого ξ между a и x. Чтобы оценить погрешность, сверху ограничь модуль очередной производной.","worked":"Для e^x и P_2(x)=1+x+x²/2 на |x|≤0.1 имеем |R_2|≤e^0.1|x|³/6.","practice":[{"q":"Оцени погрешность приближения e^0.2 ≈ 1+0.2+0.2²/2.","hint":"На [0,0.2] третья производная e^x не больше e^0.2.","solution":"|R_2|≤e^0.2·0.2³/6≈0.00163.","level":"Средняя"},{"q":"Какова оценка |sin x−x| при |x|≤0.1 по Тейлору до второго порядка?","hint":"Вторая производная в нуле равна 0; третья ограничена единицей по модулю.","solution":"|sin x−x|≤|x|³/6≤0.1³/6≈0.000167.","level":"С доказательством"}]},"2026-11-13":{"theory":"Биномиальная формула: (a+b)^n=Σ(k=0..n) C(n,k)a^(n−k)b^k. Коэффициент C(n,k) считает количество способов выбрать k множителей b из n скобок.","worked":"Коэффициент при x² в (1+x)^5 равен C(5,2)=10.","practice":[{"q":"Найди коэффициент при x³ в (2+x)^6.","hint":"Выбери три множителя x, остальные дадут 2³.","solution":"C(6,3)·2³=20·8=160.","level":"Средняя"},{"q":"Вычисли Σ(k=0..n) C(n,k) без вычисления слагаемых.","hint":"Положи a=b=1 в бином Ньютона.","solution":"Сумма равна (1+1)^n=2^n.","level":"С доказательством"}]},"2026-11-15":{"theory":"Смешанная практика: используй формулу Тейлора для оценки функций и метод Гаусса для проверки независимости векторов. Записывай, какие предпосылки нужны для каждого метода.","worked":"Разложение ln(1+x)=x−x²/2+x³/3+… верно около нуля при |x|<1.","practice":[{"q":"Найди разложение ln(1+x) до x³ включительно.","hint":"Вспомни производную ln(1+x)=1/(1+x) и геометрический ряд.","solution":"P_3=x−x²/2+x³/3.","level":"Средняя"},{"q":"Определи размерность span{(1,1,0),(0,1,1),(1,2,1)}.","hint":"Третий равен сумме первых двух.","solution":"Размерность 2; первые два независимы.","level":"С доказательством"}]},"2026-11-17":{"theory":"Неравенства часто доказывают через монотонность или глобальный минимум функции разности. Важно проверять область определения и точки равенства.","worked":"Для e^x≥1+x рассмотрим h=e^x−1−x. Производная h′=e^x−1 меняет знак с минуса на плюс в нуле; минимум 0.","practice":[{"q":"Докажи ln x≤x−1 при x>0.","hint":"Вычти ln x из x−1 и исследуй производную.","solution":"h=x−1−ln x, h′=(x−1)/x. Минимум h(1)=0.","level":"Средняя"},{"q":"Докажи x²+1≥2x для всех действительных x.","hint":"Попробуй выделить квадрат.","solution":"x²+1−2x=(x−1)²≥0; равенство при x=1.","level":"С доказательством"}]},"2026-11-18":{"theory":"Линейное отображение T удовлетворяет T(u+v)=T(u)+T(v) и T(αu)=αT(u). Ядро ker T — все векторы, переходящие в ноль; образ im T — все возможные значения. Теорема о ранге: dim ker T + dim im T = dim V.","worked":"Для T(x,y)=(x+y,0) ядро {(t,−t)}, образ {(s,0)}. Их размерности 1+1=2.","practice":[{"q":"Найди ядро T(x,y,z)=(x+y,y+z).","hint":"Реши систему x+y=0; y+z=0.","solution":"Пусть y=t, тогда x=−t и z=−t. Ядро span{(−1,1,−1)}.","level":"Средняя"},{"q":"Найди ранг этого же отображения T:R³→R².","hint":"Используй теорему о ранге и найденную размерность ядра.","solution":"dim ker=1, поэтому rank T=3−1=2.","level":"С доказательством"}]},"2026-11-19":{"theory":"Производная задаёт наклон касательной; критические точки включают нули производной и точки её несуществования. Для абсолютных экстремумов на отрезке сравни значения в критических точках и на концах.","worked":"Для x² на [−2,1] минимум 0 при x=0, максимум 4 при x=−2.","practice":[{"q":"Найди наибольшее и наименьшее значение f(x)=x³−3x на [−2,2].","hint":"Кандидаты — концы и точки с f′(x)=0.","solution":"f(−2)=−2, f(2)=2, f(−1)=2, f(1)=−2. Максимум 2, минимум −2.","level":"Средняя"},{"q":"Есть ли экстремум у f(x)=x³ в x=0?","hint":"Посмотри знак 3x² слева и справа.","solution":"Нет: f′(0)=0, но функция строго возрастает по обе стороны.","level":"С доказательством"}]},"2026-11-20":{"theory":"Принцип включения–исключения: |A∪B|=|A|+|B|−|A∩B|. Для трёх множеств добавь сумму одиночных, вычти все парные пересечения и прибавь тройное.","worked":"Числа 1..30, кратные 2 или 3: 15+10−5=20.","practice":[{"q":"Сколько чисел от 1 до 100 делятся на 2 или 5?","hint":"Посчитай отдельно кратные 2, 5 и 10.","solution":"50+20−10=60.","level":"Средняя"},{"q":"В классе 30 студентов: 18 знают Python, 15 знают C++, 8 знают оба. Сколько не знает ни одного?","hint":"Сначала найди размер объединения, потом дополнение.","solution":"|P∪C|=18+15−8=25; ни одного не знают 30−25=5.","level":"С доказательством"}]},"2026-11-22":{"theory":"Контрольная: проверяй определения и предпосылки теорем, не только вычисления. Начни с самых понятных задач; сложные оставь на оставшееся время. После работы разбери неверные решения в журнале ошибок.","worked":"Шаблон разбора: 1) какое утверждение применено; 2) какие условия проверены; 3) какие вычисления сделаны; 4) где возможна ошибка.","practice":[{"q":"Найди коэффициент при x² в (1+2x)^5.","hint":"По биному Ньютона коэффициент C(5,2)·2².","solution":"10·4=40.","level":"Средняя"},{"q":"Проверь независимость векторов (1,0,1),(0,1,1),(1,1,2).","hint":"Вычти первые два из третьего.","solution":"Зависимы: третий — сумма первых двух.","level":"С доказательством"}]}};
function lesson(date=state.date){let extra=FOUR_WEEK_LESSONS[date];if(extra&&LESSONS[date])return {...extra,tasks:LESSONS[date].tasks};return extra||LESSONS[date]||template(date)}
function tasks(date=state.date){return [...lesson(date).tasks.map((t,i)=>({id:'seed'+i,q:t[0],a:t[1]})),...(EXTENDED_LESSONS[date]?.practice||[]).map((t,i)=>({id:'expanded'+i,q:t.q,a:t.solution})),...(state.customTasks[date]||[])]}
function completeCount(date=state.date){return tasks(date).filter(t=>state.done[date+':'+t.id]).length}
function setDate(v){state.date=v;persist();render()}
function changeTab(v){tab=v;answerVisible={};hintVisible={};render()}
function nav(){document.getElementById('menu').innerHTML=MENU.map(([id,t])=>`<button class="nav ${tab===id?'active':''}" onclick="changeTab('${id}')">${esc(t)}</button>`).join('')}
function heading(){const x=MENU.find(m=>m[0]===tab);document.getElementById('pageTitle').textContent=x[1];document.getElementById('pageSub').textContent=tab==='roadmap'?'24-месячная траектория, адаптированная под твою нагрузку':tab==='week'?'Спокойный темп: понедельник и суббота без обязательных занятий':'Учёба в своём темпе • прогресс сохраняется на этом устройстве'}
function dateControl(){return `<div class="topbar"><span class="chip">${esc(dayStr(state.date))}</span><input class="datebox" type="date" value="${esc(state.date)}" onchange="setDate(this.value)"></div>`}
function getRoadmapTopic(date){let d=dateOf(date);let idx=(d.getFullYear()-2026)*12+d.getMonth()-10;return ROADMAP[Math.max(0,Math.min(ROADMAP.length-1,idx))]?.[1]||'Подготовка к ШАДу'}
function calendarHtml(){let d=dateOf(state.date),first=new Date(d.getFullYear(),d.getMonth(),1),offset=(first.getDay()+6)%7,last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let cells=Array.from({length:offset},()=>'<div class="calempty"></div>');for(let n=1;n<=last;n++){let dd=iso(new Date(d.getFullYear(),d.getMonth(),n)),l=lesson(dd),total=tasks(dd).length,done=completeCount(dd);cells.push(`<button class="calday ${dd===state.date?'selected':''}" onclick="setDate('${dd}');changeTab('today')"><b>${n}</b><small>${esc(l.topic)}</small>${total?`<span class="chip">${done}/${total} задач</span>`:''}</button>`)}return `<div class="card"><div class="topbar"><h2>${first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h2><div class="buttonrow"><button class="btn" onclick="shiftMonth(-1)">←</button><button class="btn" onclick="shiftMonth(1)">→</button></div></div><p class="sub">Нажми на дату, чтобы открыть задания и конспект. По понедельникам и субботам — отдых.</p><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells.join('')}</div></div>`}
function shiftMonth(dir){let d=dateOf(state.date);d.setDate(1);d.setMonth(d.getMonth()+dir);setDate(iso(d))}
const REVIEW_INTERVALS=[1,3,7,14];
function addDaysISO(date,n){const d=new Date(date+'T12:00:00');if(Number.isNaN(d.getTime()))return date;d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function currentISO(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function ensureReview(e){if(!Number.isInteger(e.stage)){e.stage=e.reviewed?1:0;e.nextReview=e.reviewed?addDaysISO(currentISO(),3):addDaysISO(e.date||currentISO(),1)}if(!e.nextReview)e.nextReview=addDaysISO(e.date||currentISO(),REVIEW_INTERVALS[Math.min(e.stage,3)]);return e}
function reviewStats(){const all=(state.errors||[]).map(ensureReview),today=currentISO(),active=all.filter(x=>x.stage<4);return {all,active,due:active.filter(x=>x.nextReview<=today).sort((a,b)=>a.nextReview.localeCompare(b.nextReview)),future:active.filter(x=>x.nextReview>today).sort((a,b)=>a.nextReview.localeCompare(b.nextReview)),mastered:all.filter(x=>x.stage>=4)}}
function reviewRow(e){return `<div class="listitem"><div style="flex:1;min-width:0"><b>${esc(e.title)}</b><p class="sub" style="white-space:pre-line">${esc(e.body||'')}</p><p class="tiny muted">${e.stage>=4?'Все повторения пройдены':`Повторение ${e.stage+1} из 4 · ${esc(e.nextReview)}`}</p><div class="buttonrow" style="margin-top:9px">${e.stage<4?`<button class="btn primary" onclick="repeatError('${e.id}',true)">Решено самостоятельно</button><button class="btn" onclick="repeatError('${e.id}',false)">Нужна подсказка</button>`:`<button class="btn" onclick="restartError('${e.id}')">Повторить снова</button>`}<button class="btn" onclick="editError('${e.id}')">Редактировать</button><button class="btn" onclick="removeError('${e.id}')">Удалить</button></div></div></div>`}
function errorHtml(){const r=reviewStats();return `<div class="card"><h2>Умное повторение · 1 / 3 / 7 / 14 дней</h2><p class="sub">Очередь зависит от сегодняшней даты (${esc(currentISO())}), а не от даты, выбранной в календаре. Решай задачу заново без подсказок. После успешной попытки откроется следующий интервал; при затруднении задача вернётся на завтра.</p><div class="grid" style="margin-top:16px"><div><span class="muted tiny">На сегодня</span><div class="stat">${r.due.length}</div></div><div><span class="muted tiny">Позже</span><div class="stat">${r.future.length}</div></div><div><span class="muted tiny">Закреплено</span><div class="stat">${r.mastered.length}</div></div></div></div><div class="card"><h2>Повторить сейчас</h2>${r.due.length?r.due.map(reviewRow).join(''):'<p class="sub">На сегодня повторений нет — можно сосредоточиться на новых темах.</p>'}</div><div class="card"><h2>Добавить ошибку</h2><label class="tiny muted">Тема / задача</label><input id="errTitle" class="datebox" style="width:100%;margin:8px 0" placeholder="Например: цепное правило"><label class="tiny muted">Причина ошибки / правильная идея</label><textarea id="errBody" class="note" style="min-height:95px" placeholder="Что было сложно и как нужно рассуждать"></textarea><div class="buttonrow"><button class="btn primary" onclick="addError()">+ Добавить в очередь</button></div></div><div class="card"><h2>Предстоящие повторения</h2>${r.future.length?r.future.map(reviewRow).join(''):'<p class="sub">Предстоящих повторений пока нет.</p>'}</div><div class="card"><h2>Освоенные задачи</h2>${r.mastered.length?r.mastered.map(reviewRow).join(''):'<p class="sub">После четырёх успешных повторений задачи появятся здесь.</p>'}</div>`}
function addError(){const t=document.getElementById('errTitle').value.trim(),b=document.getElementById('errBody').value.trim();if(!t)return toast('Укажи тему или задачу');const d=currentISO();state.errors.push({id:'e'+Date.now(),title:t,body:b,date:d,reviewed:false,stage:0,nextReview:addDaysISO(d,1)});persist();render();toast('Задача появится на повторении завтра')}
function repeatError(id,success){const e=(state.errors||[]).find(e=>e.id===id);if(!e)return;ensureReview(e);if(success){e.stage=Math.min(4,e.stage+1);e.nextReview=e.stage<4?addDaysISO(currentISO(),REVIEW_INTERVALS[e.stage]):null;e.reviewed=e.stage>=4}else{e.stage=0;e.reviewed=false;e.nextReview=addDaysISO(currentISO(),1)}persist();render();toast(success?'Прогресс повторения сохранён':'Добавлено на завтра')}
function restartError(id){const e=(state.errors||[]).find(x=>x.id===id);if(!e)return;e.stage=0;e.reviewed=false;e.nextReview=addDaysISO(currentISO(),1);persist();render()}
function editError(id){const e=(state.errors||[]).find(x=>x.id===id);if(!e)return;const title=prompt('Название задачи:',e.title);if(title===null)return;if(!title.trim())return toast('Название не может быть пустым');const body=prompt('Причина ошибки и правильная идея:',e.body||'');if(body===null)return;e.title=title.trim();e.body=body;persist();render()}
function removeError(id){if(!confirm('Удалить задачу из журнала ошибок?'))return;state.errors=state.errors.filter(e=>e.id!==id);persist();render()}
function progressCard(){let t=tasks();let n=completeCount();return `<div class="card"><div class="topbar"><b>${esc(lesson().topic)}</b><span class="chip pill">${esc(lesson().place)}</span></div><div class="muted tiny">Прогресс задач за выбранный день</div><div class="progress"><div class="fill" style="width:${t.length?n/t.length*100:0}%"></div></div><div class="tiny muted">${n} из ${t.length} задач выполнено</div></div>`}
// Personal work: task notes, attempt quality and actually logged minutes.
function studyKey(id,date=state.date){return date+':'+id}
function saveSolution(id){const k=studyKey(id),el=document.getElementById('solutionText');if(!el)return;const rating=document.getElementById('solutionRating')?.value||'working';state.solutions=state.solutions||{};state.solutions[k]={text:el.value,quality:rating,updatedAt:new Date().toISOString()};persist();toast('Решение сохранено');render()}
function openSolution(id){const k=studyKey(id),x=(state.solutions||{})[k]||{};const holder=document.getElementById('solutionEditor');if(!holder)return;holder.innerHTML=`<div class="card workbench"><h3>Моё решение</h3><p class="sub">${esc(tasks().find(t=>t.id===id)?.q||'Задача')}</p><textarea id="solutionText" class="note" style="min-height:210px" placeholder="Запиши рассуждения, вычисления, доказательство и оставшиеся вопросы…">${esc(x.text||'')}</textarea><label class="tiny muted" for="solutionRating">Как прошла попытка?</label><select id="solutionRating" class="datebox" style="display:block;margin:8px 0 14px;width:100%"><option value="working" ${x.quality==='working'?'selected':''}>Ещё решаю</option><option value="independent" ${x.quality==='independent'?'selected':''}>Решено самостоятельно</option><option value="hint" ${x.quality==='hint'?'selected':''}>Решено с подсказкой</option><option value="stuck" ${x.quality==='stuck'?'selected':''}>Не получилось</option></select><div class="buttonrow"><button class="btn primary" onclick="saveSolution('${id}')">Сохранить</button><button class="btn" onclick="copySolution('${id}')">Скопировать для проверки</button><button class="btn" onclick="document.getElementById('solutionEditor').innerHTML=''">Закрыть</button></div><p class="tiny muted">Записи хранятся в твоём прогрессе. Для проверки в ChatGPT скопируй текст и отправь его в наш чат.</p></div>`;holder.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function copySolution(id){const t=tasks().find(x=>x.id===id);let val=document.getElementById('solutionText')?.value || (state.solutions||{})[studyKey(id)]?.text||'';const message='Проверь моё решение задачи для подготовки к ШАДу. Не раскрывай правильный ответ сразу: сначала укажи точную ошибку или подтверди доказательство.\nДата: '+state.date+'\nЗадача: '+(t?.q||'')+'\nМоё решение:\n'+val;try{await navigator.clipboard.writeText(message);toast('Скопировано — вставь в ChatGPT')}catch(e){const a=document.createElement('textarea');a.value=message;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Текст скопирован')}}
function logMinutes(){let n=Number(document.getElementById('minutesLogged').value);if(!Number.isFinite(n)||n<1||n>480)return toast('Укажи от 1 до 480 минут');state.studyLog=state.studyLog||{};state.studyLog[state.date]=(state.studyLog[state.date]||0)+Math.round(n);persist();render();toast('Время занятия записано')}

function reportHtml(){let start=addDaysISO(currentISO(),-6),end=currentISO(),keys=Object.keys(state.done||{}).filter(k=>state.done[k]&&k.slice(0,10)>=start&&k.slice(0,10)<=end),notes=Object.entries(state.solutions||{}).filter(([k,v])=>k.slice(0,10)>=start&&k.slice(0,10)<=end),mins=Object.entries(state.studyLog||{}).filter(([d])=>d>=start&&d<=end).reduce((n,[d,v])=>n+(+v||0),0),due=reviewStats().due.length,stuck=notes.filter(([k,v])=>v.quality==='stuck'||v.quality==='hint').slice(-12);return `ОТЧЁТ О ПОДГОТОВКЕ К ШАДУ\nПериод: ${start} — ${end}\nРешено задач (отмечено): ${keys.length}\nЗаписано времени: ${mins} минут\nРешений с текстом: ${notes.length}\nНа повторении сейчас: ${due}\nНужны разборы:\n${stuck.map(([k,v])=>'• '+k+': '+v.quality+'; '+v.text.slice(0,230)).join('\n')||'—'}\nПожалуйста, оцени нагрузку и составь план на следующую неделю с учётом того, что понедельник и суббота свободны, а в будни после университета мало сил.`}

 const weeks=[];for(let offset=7;offset>=0;offset--){let anchor=weekStart(dateOf(currentISO()));anchor.setDate(anchor.getDate()-7*offset);let n=0;for(let j=0;j<7;j++){const d=new Date(anchor);d.setDate(d.getDate()+j);n+=byDate[iso(d)]||0;}weeks.push({name:anchor.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}),count:n});}
 const max=Math.max(1,...weeks.map(w=>w.count));
 const groupDefs=[['Матанализ',/матанализ|производн|предел|тейлор|ролл|лагранж|интеграл|ряд|неравенств/i],['Линейная алгебра',/линейн|матриц|гаусс|определител|базис|ранг|собственн|вектор/i],['Комбинаторика и алгоритмы',/комбинатор|алгоритм|граф|дискрет|рекуррент/i],['Вероятность',/вероятн|распределени|случайн|ковариац|матожидани/i]];
 const topics=groupDefs.map(([name,re])=>{let solved=0,all=0;for(const day of completedDates){if(re.test(lesson(day).topic)){solved+=byDate[day]||0;}}for(const day of possibleDates){if(re.test(lesson(day).topic))all+=tasks(day).length;}return {name,solved,all,pct:all?Math.min(100,Math.round(100*solved/all)):0};});
 return `<div class="card analytics-hero"><div class="tiny" style="color:#ffe6ee">ТВОЯ ПОДГОТОВКА · СТАТИСТИКА</div><h2 style="margin-top:10px">Маленькие шаги каждый день — большой результат к ШАДу</h2><p class="sub">Все показатели рассчитаны по отметкам задач и журналу ошибок. Никаких выдуманных часов: учёт времени пока не ведётся.</p></div>
 <div class="analytics-stats" style="margin:18px 0"><div class="analytics-metric"><small>Отмечено задач</small><strong>${total}</strong><small>с начала подготовки</small></div><div class="analytics-metric"><small>Дней с решёнными задачами</small><strong>${attended}</strong><small>из ${possibleDates.length} учебных дней</small></div><div class="analytics-metric"><small>Регулярность</small><strong>${rate}%</strong><small>учебные дни с отметками</small></div><div class="analytics-metric"><small>Освоено повторений</small><strong>${mastered}</strong><small>ожидают повторения: ${due}</small></div></div>
 <div class="card"><h2>Решённые задачи по неделям</h2><p class="sub">Последние 8 календарных недель. Если график пустой, отметь выполненные задачи в разделе «Задачи дня».</p><div class="analytics-bars">${weeks.map(w=>`<div class="analytics-bar-group"><b>${w.count}</b><div class="analytics-bar-track"><div class="analytics-bar-fill" style="height:${w.count?Math.max(5,w.count/max*100):0}%"></div></div><span>${esc(w.name)}</span></div>`).join('')}</div></div>
 <div class="card"><h2>Прогресс по направлениям</h2><p class="sub">Доля отмеченных задач относительно заданий, запланированных по каждому направлению с начала подготовки.</p>${topics.map(t=>`<div class="topic-line"><div class="topic-meta"><b>${esc(t.name)}</b><span>${t.solved} / ${t.all} · ${t.pct}%</span></div><div class="topic-track"><div class="topic-fill" style="width:${t.pct}%"></div></div></div>`).join('')}<div class="analytics-note">Показатели отражают отметки о выполнении, а не проверенные знания. Если задачи уже были пройдены раньше или добавлены вручную, статистика может не полностью отражать подготовку. Синхронизация использует прежнюю таблицу study_data.</div></div>
 <div class="card"><h2>Что делать дальше</h2><p class="sub">Проверяй график раз в воскресенье. Главное — не непрерывная серия дней, а устойчивость привычки и качество решений.</p><div class="buttonrow" style="margin-top:15px"><button class="btn primary" onclick="changeTab('tasks')">Перейти к задачам</button><button class="btn" onclick="changeTab('errors')">Повторить ошибки (${due})</button></div></div>`;
}

function toggleTask(id,v){state.done[state.date+':'+id]=v;persist();render()}
function toggleAnswer(id){answerVisible[id]=!answerVisible[id];render()}
function toggleHint(id){hintVisible[id]=!hintVisible[id];render()}
function addTaskError(id){const x=tasks().find(t=>t.id===id);if(!x)return;state.errors.push({id:'e'+Date.now(),title:x.q,body:'Вернуться к решению и записать причину затруднения.',date:currentISO(),reviewed:false,stage:0,nextReview:addDaysISO(currentISO(),1)});persist();toast('Задача добавлена в журнал ошибок');render()}

function addTask(){let q=document.getElementById('newTask').value.trim(),a=document.getElementById('newAnswer').value.trim();if(!q)return toast('Добавь условие');if(!state.customTasks[state.date])state.customTasks[state.date]=[];state.customTasks[state.date].push({id:'custom'+Date.now(),q,a});persist();render();toast('Задача добавлена')}
function deleteTask(id){state.customTasks[state.date]=(state.customTasks[state.date]||[]).filter(x=>x.id!==id);persist();render()}
function saveTheory(){state.customTheory[state.date]=document.getElementById('customTheory').value;persist();toast('План теории сохранён')}
function saveNote(){state.notes[state.date]=document.getElementById('noteText').value;persist();toast('Конспект сохранён')}
function shiftWeek(d){let x=dateOf(state.date);x.setDate(x.getDate()+d);setDate(iso(x))}
function exportData(){let data=JSON.stringify({app:'Подготовка к ШАДу',version:1,exportedAt:new Date().toISOString(),state},null,2);let blob=new Blob([data],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='shad-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);let s=x.state||x;if(!s.done||!s.notes)throw Error('Неверный формат');state={...state,...s};persist();render();toast('Прогресс импортирован')}catch(err){alert('Не удалось прочитать файл прогресса.')}};r.readAsText(f);e.target.value=''}

// Optional cloud sync. Credentials are configured by the user; no service is connected by default.
let cloudClient=null,cloudUser=null,saveTimer=null,cloudBusy=false;
const cloudConfig=()=>{try{return JSON.parse(localStorage.getItem('shad-cloud-config')||'null')}catch(e){return null}};
function syncHtml(){const c=cloudConfig();return `<div class="card"><h2>Синхронизация между устройствами</h2><p class="sub">Прогресс по умолчанию хранится только в твоём браузере. Для синхронизации подключи собственный проект Supabase (бесплатный тариф зависит от условий сервиса). Данные остаются в твоём проекте, а доступ ограничивается аккаунтом через RLS.</p><h3 style="margin-top:20px">1. Настройка сервиса</h3><p class="tiny muted">Впиши Project URL и publishable/anon key из Supabase → Project Settings → API. Не используй secret или service_role key.</p><input class="datebox" id="sbUrl" style="display:block;width:100%;margin:10px 0" placeholder="https://your-project.supabase.co" value="${esc(c?.url||'')}"><input class="datebox" id="sbKey" style="display:block;width:100%;margin:10px 0" placeholder="Publishable / anon key" value="${esc(c?.key||'')}"><div class="buttonrow"><button class="btn primary" onclick="configureCloud()">Сохранить настройки</button><button class="btn" onclick="clearCloud()">Отключить проект</button></div><h3 style="margin-top:24px">2. Вход по электронной почте</h3><input class="datebox" id="sbEmail" type="email" style="display:block;width:100%;margin:10px 0" placeholder="Твоя почта"><div class="buttonrow"><button class="btn primary" onclick="cloudLogin()">Получить ссылку для входа</button><button class="btn" onclick="cloudLogout()">Выйти</button><button class="btn" onclick="updateCloudStatus()">Проверить вход</button></div><p class="sub" id="cloudStatus" style="margin-top:12px">${cloudUser?'Вход выполнен: '+esc(cloudUser.email):'Нет активного облачного сеанса'}</p><h3 style="margin-top:24px">3. Перенести прогресс</h3><p class="sub">Сначала сделай экспорт резервной копии. Кнопка «Загрузить из облака» заменяет локальные отметки и конспекты данными из облака. «Отправить в облако» заменяет облачную копию текущими локальными данными.</p><div class="buttonrow" style="margin-top:14px"><button class="btn" onclick="exportData()">Экспортировать копию</button><button class="btn" onclick="cloudPull()">Загрузить из облака</button><button class="btn primary" onclick="cloudPush(true)">Отправить в облако</button></div><p class="tiny muted" style="margin-top:14px">После успешного входа изменения автоматически отправляются в облако с задержкой. При одновременном редактировании на двух устройствах побеждает последняя сохранённая копия. Не используй одновременно два открытых устройства для редактирования.</p></div>`}
async function configureCloud(){let url=document.getElementById('sbUrl').value.trim().replace(/\/$/,''),key=document.getElementById('sbKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key){alert('Укажи адрес проекта вида https://…supabase.co и publishable/anon key.');return}localStorage.setItem('shad-cloud-config',JSON.stringify({url,key}));cloudClient=null;await initCloud();toast('Настройки сохранены');render()}
function clearCloud(){if(!confirm('Отключить облачный проект на этом устройстве? Локальные данные сохранятся.'))return;cloudClient=null;cloudUser=null;localStorage.removeItem('shad-cloud-config');render()}
async function initCloud(){let c=cloudConfig();if(!c||!window.supabase)return null;try{cloudClient=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let r=await cloudClient.auth.getUser();cloudUser=r.data?.user||null;return cloudClient}catch(e){toast('Ошибка подключения: '+e.message);return null}}
async function updateCloudStatus(){if(!cloudClient)await initCloud();if(!cloudClient)return toast('Сначала настрой проект');let {data,error}=await cloudClient.auth.getUser();cloudUser=data?.user||null;render();if(error)toast(error.message)}
async function cloudLogin(){if(!cloudClient)await initCloud();if(!cloudClient)return toast('Сначала настрой проект');let email=document.getElementById('sbEmail').value.trim();if(!email.includes('@'))return toast('Введи электронную почту');let redirectTo=location.protocol==='https:'?location.origin+location.pathname:undefined;let {error}=await cloudClient.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo}});if(error)alert(error.message);else alert('Проверь почту. Открой ссылку для входа на том же сайте. Если ссылка не пришла, проверь настройки Auth → URL Configuration в Supabase.')}
async function cloudLogout(){if(!cloudClient)await initCloud();if(cloudClient)await cloudClient.auth.signOut();cloudUser=null;render();toast('Выход из облака выполнен')}
function queueCloudSave(){if(!cloudClient||!cloudUser)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>cloudPush(false),1600)}
async function cloudPush(manual){if(cloudBusy)return;if(!cloudClient)await initCloud();if(!cloudClient||!cloudUser){if(manual)toast('Сначала войди в облачный аккаунт');return}if(manual&&!confirm('Заменить облачную копию текущими локальными данными?'))return;cloudBusy=true;let {error}=await cloudClient.from('study_data').upsert({user_id:cloudUser.id,content:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});cloudBusy=false;if(error){toast('Синхронизация: '+error.message)}else if(manual)toast('Прогресс отправлен в облако')}
async function cloudPull(){if(!cloudClient)await initCloud();if(!cloudClient||!cloudUser)return toast('Сначала войди в облачный аккаунт');if(!confirm('Заменить локальный прогресс облачной копией? Сначала рекомендуем экспортировать данные.'))return;let {data,error}=await cloudClient.from('study_data').select('content').eq('user_id',cloudUser.id).maybeSingle();if(error)return toast(error.message);if(!data)return toast('Облачная копия ещё не создана');let s=data.content;if(!s||!s.done||!s.notes)return toast('Некорректные облачные данные');state={...state,...s};localStorage.setItem('shad-2026-v1',JSON.stringify(state));render();toast('Облачная копия загружена')}

const VECTOR_WEEK = {"2026-10-27":{"topic":"Векторы: координаты и действия","place":"Дома: 90 минут · в дороге: 15–20 минут","sections":[["Что такое вектор","Вектор характеризуется направлением и длиной. Геометрически его изображают направленным отрезком, но свободный вектор не привязан к месту на плоскости: перенос без изменения длины и направления даёт тот же вектор. Нулевой вектор имеет длину ноль, его направление не определено. Противоположный вектор имеет ту же длину и противоположное направление. Коллинеарные векторы лежат на параллельных прямых, компланарные — на параллельных плоскостях. Не путай точку с вектором: точка задаёт положение, вектор — перемещение."],["Координаты и переход между точками","В прямоугольной системе координат вектор представляют упорядоченным набором чисел: a=(a₁,a₂) на плоскости или a=(a₁,a₂,a₃) в пространстве. Вектор AB получается вычитанием координат начала из координат конца. Например, если A=(−2,3), B=(4,−1), то AB=(6,−4). Если AB известен, координаты B находятся сложением A+AB. При вычислениях полезно сразу записывать координаты в столбик: так проще избежать ошибок со знаками."],["Сложение и умножение на число","Векторы складывают покомпонентно. Геометрически сумму можно представить правилом треугольника или параллелограмма. Умножение на положительное число сохраняет направление и изменяет длину во столько раз, чему равен модуль числа; отрицательное число дополнительно меняет направление на противоположное. Например, при a=(2,−3), b=(−1,4) получаем 2a−b=(5,−10). Эти действия линейны: λ(a+b)=λa+λb. Именно такие линейные комбинации позднее определят базисы и линейные пространства."],["Длина, расстояние, единичный вектор","Длина вектора вычисляется по теореме Пифагора. Для (3,4) она равна 5. Расстояние между двумя точками — длина их разности. Чтобы получить единичный вектор того же направления, раздели ненулевой вектор на его длину. Если a=(3,4), единичный вектор равен (3/5,4/5). Нулевой вектор нормировать нельзя: деление на ноль не определено. При решении геометрических задач проверяй, нужно ли получить длину, квадрат длины или сами координаты."],["Коллинеарность и параметрические задачи","Ненулевые векторы a и b коллинеарны тогда и только тогда, когда b=λa для некоторого числа λ. На плоскости удобен критерий a₁b₂−a₂b₁=0. Например, (2,6) и (−1,−3) коллинеарны, потому что второй равен −1/2 первого. Если компоненты зависят от параметра, подставь их в критерий и реши полученное уравнение. Не дели механически на координату, которая может оказаться нулём: так можно потерять решения."],["Алгоритм решения и типичные ошибки","Сначала выпиши известные точки и векторы, затем выбери подходящую формулу. Для задачи на AB всегда вычитай B−A, а не наоборот. Для коллинеарности не сравнивай только длины — равные длины не означают одинакового направления. Для нормировки проверяй, что вектор ненулевой. В конце сопоставь результат с геометрическим смыслом: длина не может быть отрицательной, середина отрезка должна лежать между концами, а линейная комбинация вычисляется отдельно по каждой координате."],["Разобранный пример","Даны A=(1,−2), B=(5,1), C=(−1,3). Сначала AB=(4,3), AC=(−2,5). Длины: |AB|=5, |AC|=√29. Сумма AB+AC=(2,8). Точка D с условием AD=2AB−AC имеет координаты A+(10,1)=(11,−1). Обрати внимание на порядок действий: сначала строим векторы из точек, затем применяем линейную комбинацию и только в конце добавляем координаты начала."],["Как проверить понимание","Попробуй без подсказок объяснить, почему расстояние между A и B совпадает с длиной AB и почему AB=−BA. Проверь пример сложением AB+BA: должен получиться нулевой вектор. После этого реши 10 задач: первые четыре закрепляют вычисления, следующие четыре требуют геометрической интерпретации, последние две — работы с параметрами и доказательства."],["Почему геометрическое и координатное определения согласованы","Пусть вектор изображён отрезком AB. При переносе всей фигуры на один и тот же вектор t новые концы будут A+t и B+t, поэтому разность (B+t)−(A+t) остаётся равной B−A. Это показывает, почему свободный вектор не зависит от точки приложения. Из этого факта следует и правило треугольника: если мы сначала перемещаемся из A в B, а потом из B в C, общее перемещение равно AC. В координатах AB+BC=(B−A)+(C−B)=C−A. Такое доказательство гораздо надёжнее рисунка, на котором легко ошибиться с ориентацией стрелок."],["Как выбирать между координатами и геометрией","В задачах о середине, длине, прямой или направлении можно начать с рисунка, чтобы определить смысл ответа, а затем перейти к координатам. Например, если середина M отрезка AB, равенство AM=MB означает M−A=B−M. Отсюда 2M=A+B: формула середины получается без заучивания. Аналогично деление отрезка в отношении p:q можно вывести из уравнения направленных векторов. Учись получать формулу из условий, а не только вспоминать готовую: на контрольной это спасает, когда задача сформулирована непривычно."],["Откуда берётся норма","Для вектора (x,y) строят прямоугольный треугольник, где катеты имеют длины |x| и |y|. По теореме Пифагора квадрат гипотенузы равен x²+y². В трёхмерном пространстве добавляется третья ортогональная составляющая z, и квадрат длины становится x²+y²+z². Если ввести число t, то длина ta равна |t|·|a|: квадрат длины умножается на t². Этот факт полезен при нормировке и проверке ответов. В частности, длина любого вектора неотрицательна, а равна нулю только для нулевого вектора."],["Стратегия самостоятельного решения","Не начинай с вычислений вслепую. Прочитай задачу и подчеркни слова «направление», «длина», «коллинеарность», «через точку» и «координаты». Каждое из них указывает на отдельный инструмент. Если задача содержит параметр, прежде чем делить на выражение, спроси, может ли оно быть нулём. Если получилось несколько ответов, подставь каждый в исходное условие. После решения придумай быстрый тест: например, для вектора AB сравни знаки координат с рисунком, для единичного вектора проверь квадрат нормы, для точки на прямой проверь коллинеарность. Такие проверки занимают минуту, но часто экономят много баллов."]],"formulas":[{"id":"auto-2026-10-27-0","title":"Вектор между точками","expression":"\\overrightarrow{AB}=B-A","category":"Линейная алгебра · Векторы: координаты и действия"},{"id":"auto-2026-10-27-1","title":"Сумма векторов","expression":"(a+b)_i=a_i+b_i","category":"Линейная алгебра · Векторы: координаты и действия"},{"id":"auto-2026-10-27-2","title":"Линейная комбинация","expression":"(\\alpha a+\\beta b)_i=\\alpha a_i+\\beta b_i","category":"Линейная алгебра · Векторы: координаты и действия"},{"id":"auto-2026-10-27-3","title":"Длина вектора","expression":"\\|a\\|=\\sqrt{a_1^2+a_2^2+a_3^2}","category":"Линейная алгебра · Векторы: координаты и действия"},{"id":"auto-2026-10-27-4","title":"Единичный вектор","expression":"\\hat a=\\frac{a}{\\|a\\|}","category":"Линейная алгебра · Векторы: координаты и действия"},{"id":"auto-2026-10-27-5","title":"Коллинеарность на плоскости","expression":"a_1b_2-a_2b_1=0","category":"Линейная алгебра · Векторы: координаты и действия"}],"tasks":[{"id":"vector-2026-10-27-1","q":"Даны A=(−3,2), B=(5,−4). Найди AB, BA и проверь, что их сумма нулевая.","hint":"Конец минус начало.","a":"AB=(8,−6), BA=(−8,6), сумма (0,0)."},{"id":"vector-2026-10-27-2","q":"Пусть a=(2,−5), b=(−4,1). Найди 3a−2b и его длину.","hint":"Каждую координату вычисляй отдельно.","a":"3a−2b=(14,−17); длина √485."},{"id":"vector-2026-10-27-3","q":"Найди точку B, если A=(−2,7), AB=(5,−9).","hint":"B=A+AB.","a":"B=(3,−2)."},{"id":"vector-2026-10-27-4","q":"Найди длину вектора (−6,8) и единичный вектор его направления.","hint":"Раздели каждую координату на длину.","a":"Длина 10, единичный (−3/5,4/5)."},{"id":"vector-2026-10-27-5","q":"Даны точки P=(1,2), Q=(7,−2). Найди середину отрезка PQ и расстояние PQ.","hint":"Середина — среднее координат.","a":"M=(4,0), |PQ|=2√13."},{"id":"vector-2026-10-27-6","q":"Проверь коллинеарность a=(3,−6) и b=(−2,4). Найди коэффициент λ в b=λa.","hint":"Проверь обе координаты.","a":"Да, λ=−2/3."},{"id":"vector-2026-10-27-7","q":"Для каких t векторы (t,2) и (6,t+1) коллинеарны?","hint":"Используй детерминант 2×2.","a":"t(t+1)−12=0; t=3 или t=−4."},{"id":"vector-2026-10-27-8","q":"Для a=(1,2), b=(3,−1) найди x,y из xa+yb=(7,0).","hint":"Составь систему для двух координат.","a":"x=1, y=2."},{"id":"vector-2026-10-27-9","q":"Докажи по координатам равенство |a+b|²+|a−b|²=2|a|²+2|b|² для плоских векторов.","hint":"Раскрой квадраты покомпонентно.","a":"Смешанные слагаемые +2aᵢbᵢ и −2aᵢbᵢ сокращаются; остаются 2Σaᵢ²+2Σbᵢ²."},{"id":"vector-2026-10-27-10","q":"Точки A=(1,1), B=(5,3), C=(t,7) лежат на одной прямой. Найди t и поясни критерий.","hint":"AB и AC должны быть коллинеарны.","a":"AB=(4,2), AC=(t−1,6); 4·6−2(t−1)=0, откуда t=13."}]},"2026-10-28":{"topic":"Скалярное произведение, углы и проекции","place":"Среда после 17:30 · 2 часа","sections":[["Скалярное произведение","Скалярное произведение двух векторов — число, а не вектор. В ортонормированной системе координат его вычисляют как сумму произведений соответствующих координат. В геометрической форме это произведение длин на косинус угла между ненулевыми векторами. Именно связь координат и угла делает формулу универсальной: можно переходить от алгебраического вычисления к геометрическому выводу и обратно."],["Угол между векторами","Для ненулевых a,b имеем cos φ=(a·b)/(|a||b|). Если значение косинуса положительно, угол острый; если отрицательно — тупой; если равно нулю — прямой. В вычислениях из-за округления косинус иногда получается 1.0000001: это лишь погрешность, теоретически значение лежит от −1 до 1. У нулевого вектора угол с другим вектором в этом смысле не определён."],["Ортогональность","Векторы перпендикулярны тогда и только тогда, когда их скалярное произведение равно нулю, если рассматриваем обычное евклидово пространство. Например, (2,3) и (3,−2) ортогональны: 2·3+3·(−2)=0. Так проверяют прямой угол, находят неизвестную координату, строят нормали к прямой и плоскости. Важно: нулевое скалярное произведение не требует ненулевых векторов, но для определения угла ненулевость необходима."],["Длина и свойства","Свойства скалярного произведения: симметрия a·b=b·a, линейность по каждому аргументу, положительная определённость a·a≥0 и равенство нулю только для a=0. Поэтому a·a=|a|². Раскрывая (a+b)·(a+b), получаем |a+b|²=|a|²+2a·b+|b|². Это векторный аналог формулы квадрата суммы, полезный для доказательств и задач с длинами."],["Проекция на направление","Скалярная проекция a на направление ненулевого b равна (a·b)/|b| и может быть отрицательной. Векторная ортогональная проекция равна ((a·b)/|b|²)b. Пример: a=(3,4), b=(1,0). Тогда проекция a на b равна (3,0), а перпендикулярная составляющая — (0,4). После вычитания проекции остаток должен быть ортогонален b: это хороший способ проверки вычислений."],["Неравенство Коши — Буняковского","Неравенство |a·b|≤|a||b| гарантирует, что отношение для косинуса находится в допустимом диапазоне. Равенство для ненулевых векторов наступает тогда и только тогда, когда они коллинеарны. Неравенство можно доказывать через неотрицательность квадрата длины a−tb для любого t: получаем квадратный трёхчлен с неположительным дискриминантом. Это пример связи геометрической идеи с алгебраическим доказательством."],["Разобранный пример","Даны a=(1,2,2), b=(2,−1,2). Скалярное произведение: 2−2+4=4. Длины: |a|=3, |b|=3, поэтому cos φ=4/9. Проекция a на b равна (4/9)b=(8/9,−4/9,8/9). Перпендикулярный остаток a−proj_b a=(1/9,22/9,10/9). Проверка: произведение остатка на b равно 2/9−22/9+20/9=0."],["Что важно для контрольной","Умей без подсказок находить угол между векторами, распознавать ортогональность и вычислять проекции. Для доказательств сначала запиши свойства скалярного произведения, а уже затем подставляй координаты. В задачах со значениями параметров помни, что векторы могут оказаться нулевыми: проверь область, где формула угла корректна."],["Два способа понять угол","Векторный угол — это угол между направлениями, а не между точками или координатами. На плоскости можно построить два вектора с общим началом и измерить меньший угол между ними от нуля до 180 градусов. Скалярное произведение переводит эту геометрию в координаты. При угле 90 градусов косинус нулевой, поэтому произведение равно нулю. Если два вектора смотрят примерно в одну сторону, их произведение положительно; если в противоположные — отрицательно. Отдельно запомни, что отрицательное произведение не означает отрицательную длину: это знак взаимной ориентации."],["Как вывести формулу косинуса без зубрёжки","Рассмотри треугольник, образованный векторами a, b и a−b. По теореме косинусов его противоположная сторона удовлетворяет |a−b|²=|a|²+|b|²−2|a||b|cosφ. С другой стороны, раскрой квадрат через скалярное произведение: (a−b)·(a−b)=|a|²+|b|²−2a·b. Сравнив правые части, получаем геометрическую формулу скалярного произведения. Здесь важна логика: нам не нужны отдельные правила для координат и углов, потому что обе формулы описывают одно и то же число."],["Почему остаток от проекции перпендикулярен","Векторная проекция p=tb лежит на прямой, задаваемой b. Нам нужно подобрать коэффициент t, чтобы остаток a−tb был ортогонален этой прямой. Условие (a−tb)·b=0 раскрывается как a·b−t(b·b)=0. Следовательно, t=(a·b)/(b·b), если b ненулевой. Это не магическая формула, а решение простого уравнения. Поэтому её легко восстановить на контрольной. Кроме того, проекция минимизирует расстояние от a до линии tb: любой иной выбор t оставляет ненулевую составляющую вдоль b."],["В каких задачах помогает Коши","Неравенство Коши — Буняковского полезно не только для проверки косинуса. Оно позволяет оценивать суммы произведений без нахождения каждого слагаемого по отдельности. Например, |x₁y₁+x₂y₂| не больше произведения корней из x₁²+x₂² и y₁²+y₂². Если в задаче требуется найти максимум линейного выражения при ограничении на квадрат суммы координат, равенство в Коши часто подсказывает оптимальное направление. Чтобы не потерять смысл, проверяй условие равенства: у ненулевых векторов оно означает коллинеарность."]],"formulas":[{"id":"auto-2026-10-28-0","title":"Скалярное произведение","expression":"a\\cdot b=\\sum_i a_ib_i","category":"Линейная алгебра · Скалярное произведение, углы и проекции"},{"id":"auto-2026-10-28-1","title":"Связь с углом","expression":"a\\cdot b=\\|a\\|\\|b\\|\\cos\\varphi","category":"Линейная алгебра · Скалярное произведение, углы и проекции"},{"id":"auto-2026-10-28-2","title":"Косинус угла","expression":"\\cos\\varphi=\\frac{a\\cdot b}{\\|a\\|\\|b\\|}","category":"Линейная алгебра · Скалярное произведение, углы и проекции"},{"id":"auto-2026-10-28-3","title":"Ортогональность","expression":"a\\perp b\\iff a\\cdot b=0","category":"Линейная алгебра · Скалярное произведение, углы и проекции"},{"id":"auto-2026-10-28-4","title":"Проекция","expression":"\\operatorname{proj}_b a=\\frac{a\\cdot b}{\\|b\\|^2}b","category":"Линейная алгебра · Скалярное произведение, углы и проекции"},{"id":"auto-2026-10-28-5","title":"Коши — Буняковский","expression":"|a\\cdot b|\\leq\\|a\\|\\|b\\|","category":"Линейная алгебра · Скалярное произведение, углы и проекции"}],"tasks":[{"id":"vector-2026-10-28-1","q":"Вычисли (2,−1,3)·(4,5,−2).","hint":"Сумма произведений соответствующих координат.","a":"8−5−6=−3."},{"id":"vector-2026-10-28-2","q":"Найди угол между (1,0) и (1,√3).","hint":"Найди косинус.","a":"cos φ=1/2, поэтому φ=60°."},{"id":"vector-2026-10-28-3","q":"При каком t векторы (t,2,−1) и (3,t,1) ортогональны?","hint":"Приравняй скалярное произведение к нулю.","a":"3t+2t−1=0, t=1/5."},{"id":"vector-2026-10-28-4","q":"Найди квадрат длины (2,−3,6), не вычисляя корень.","hint":"a·a.","a":"49."},{"id":"vector-2026-10-28-5","q":"Вычисли проекцию a=(4,2) на b=(1,1).","hint":"Коэффициент (a·b)/(b·b).","a":"proj_b a=(3,3)."},{"id":"vector-2026-10-28-6","q":"Найди составляющую a=(4,2), перпендикулярную b=(1,1), и проверь ортогональность.","hint":"Вычти проекцию.","a":"(1,−1); скалярное произведение с (1,1) равно 0."},{"id":"vector-2026-10-28-7","q":"Даны |a|=3, |b|=5 и a·b=6. Найди |a+b|.","hint":"Раскрой квадрат длины суммы.","a":"√(9+25+12)=√46."},{"id":"vector-2026-10-28-8","q":"Найди все t, при которых угол между a=(t,1) и b=(1,0) острый.","hint":"Острый угол ⇔ a·b>0.","a":"t>0."},{"id":"vector-2026-10-28-9","q":"Докажи для произвольных a,b неравенство |a+b|≤|a|+|b| через скалярное произведение.","hint":"Возведи обе стороны в квадрат и примени Коши.","a":"|a+b|²=|a|²+2a·b+|b|²≤(|a|+|b|)²; извлеки корень."},{"id":"vector-2026-10-28-10","q":"Для a=(1,1,0), b=(1,0,1) найди угол и векторную проекцию a на b.","hint":"Длины обоих √2.","a":"cos φ=1/2, φ=60°; proj_b a=(1/2,0,1/2)."}]},"2026-10-29":{"topic":"Линейная зависимость и геометрия векторов","place":"Четверг · дома 60 минут + дорожное повторение","sections":[["Линейная комбинация","Линейной комбинацией векторов a₁,…,aₖ называют выражение c₁a₁+…+cₖaₖ. Коэффициенты — обычные числа; при работе с координатами выражение вычисляется покомпонентно. Например, (5,1)=2(1,2)+(1,−3). Запись комбинации задаёт способ собрать новый вектор из исходных направлений. Это первый шаг к понятию линейной оболочки, базиса, ранга матрицы и решения систем."],["Линейная зависимость","Векторы линейно зависимы, если существует нетривиальная комбинация, равная нулю: хотя бы один коэффициент не равен нулю. Иначе они линейно независимы. Для пары векторов зависимость означает, что один выражается через другой. Для трёх векторов на плоскости зависимость неизбежна, потому что двумерное пространство не может содержать три независимых направления. Но три вектора в трёхмерном пространстве могут быть независимы."],["Геометрический смысл","В плоскости два ненулевых вектора независимы, если они не коллинеарны; в пространстве три вектора независимы, если они не лежат в одной плоскости, проходящей через начало. Два независимых вектора на плоскости позволяют представить любой другой как их линейную комбинацию. Так геометрическая картинка объясняет, зачем проверять зависимость: она показывает, сколько действительно новых направлений у нас есть."],["Проверка через уравнение","Чтобы исследовать набор векторов, составь c₁a₁+…+cₖaₖ=0 и приравняй координаты. Получится однородная линейная система. Если её единственное решение — все коэффициенты нулевые, векторы независимы. Если есть другое решение — зависимы. Для двух векторов на плоскости удобно использовать определитель; для большего числа — метод Гаусса. Это надёжнее попыток заметить коэффициенты на глаз."],["Определитель для двух и трёх векторов","Для двух плоских векторов (a₁,a₂),(b₁,b₂) определитель a₁b₂−a₂b₁ отличен от нуля ровно при независимости. Для трёх пространственных векторов можно составить квадратную матрицу из столбцов-векторов: ненулевой определитель означает независимость. Если определитель равен нулю, векторы зависимы. Если ты не уверена в вычислении определителя 3×3, проверяй результат методом Гаусса."],["Параметр и особые значения","При наличии параметра определитель или ранги становятся функциями параметра. Найди значения, при которых определитель обращается в ноль. На остальных значениях квадратный набор векторов независим. При делении на выражение с параметром обязательно разбирай случай, когда знаменатель нулевой: иначе можно пропустить исключительный вариант."],["Разобранный пример","Исследуем a=(1,2), b=(3,1). Определитель равен 1·1−2·3=−5, поэтому векторы независимы. Представим c=(7,0) в виде xa+yb: x+3y=7, 2x+y=0. Из второго x=−y/2, получаем (5/2)y=7, y=14/5, x=−7/5. Проверка по координатам: (−7/5)(1,2)+(14/5)(3,1)=(7,0)."],["Ошибки и самопроверка","Нетривиальное решение значит не все коэффициенты равны нулю, а не каждый коэффициент ненулевой. Нулевой вектор в любом наборе автоматически делает набор зависимым. Для любого набора из более чем n векторов в Rⁿ зависимость неизбежна. Прежде чем решать десять задач, попробуй своими словами ответить, почему две пропорциональные координатные строки не дают двух независимых направлений."],["Зависимость как нехватка новых направлений","Если второй вектор выражается через первый, то он не добавляет нового направления. На плоскости один ненулевой вектор порождает прямую через начало, а два независимых — всю плоскость. В трёхмерном пространстве одна независимая пара порождает плоскость, третье независимое направление выводит нас за её пределы. Так геометрически читается число линейно независимых векторов. Наличие нулевого вектора не помогает расширить оболочку, потому что любой его коэффициент в сумме даёт ноль; именно поэтому такой набор автоматически зависим."],["Что означает однородная система","Уравнение c₁a₁+...+cₖaₖ=0 после перехода к координатам становится системой с нулевой правой частью. Нулевое решение есть всегда. Вопрос независимости — есть ли другие? Если неизвестных коэффициентов больше, чем координатных уравнений, ненулевое решение обязательно существует. Однако при равенстве числа векторов и размерности независимость ещё нужно проверять: квадратная матрица может быть вырожденной. В методе Гаусса свободная переменная свидетельствует о нетривиальном решении, а отсутствие свободных переменных — о единственности нулевого."],["Почему определитель работает","Определитель матрицы из двух плоских векторов по модулю равен площади параллелограмма на них. Если площадь нулевая, направления не образуют настоящую плоскость: векторы лежат на одной прямой. При ненулевой площади они независимы. Для трёх векторов в пространстве определитель по модулю связан с объёмом параллелепипеда. Нулевой объём означает, что третье направление находится в плоскости первых двух. Так алгебраический критерий связывается с геометрической интуицией."],["Как оформить доказательство с параметром","Допустим, определитель зависит от t и равен (t−1)(t+2). При t≠1 и t≠−2 он ненулевой, следовательно, столбцы независимы. При t=1 и t=−2 он равен нулю, следовательно, зависимы. Важно явно записать оба случая и не закончить словами «det=0». Если в условии нужно ещё построить нетривиальную комбинацию, после нахождения особого параметра подставь его в систему и найди коэффициенты зависимости. Один только определитель не даёт саму комбинацию."]],"formulas":[{"id":"auto-2026-10-29-0","title":"Линейная комбинация","expression":"v=\\sum_{i=1}^k c_i a_i","category":"Линейная алгебра · Линейная зависимость и геометрия векторов"},{"id":"auto-2026-10-29-1","title":"Критерий зависимости","expression":"\\exists\\,(c_1,\\dots,c_k)\\ne0:\\quad\\sum_{i=1}^k c_i a_i=0","category":"Линейная алгебра · Линейная зависимость и геометрия векторов"},{"id":"auto-2026-10-29-2","title":"Определитель двух векторов","expression":"\\det(a,b)=a_1b_2-a_2b_1","category":"Линейная алгебра · Линейная зависимость и геометрия векторов"},{"id":"auto-2026-10-29-3","title":"Независимость на плоскости","expression":"\\det(a,b)\\ne0","category":"Линейная алгебра · Линейная зависимость и геометрия векторов"}],"tasks":[{"id":"vector-2026-10-29-1","q":"Вырази (8,−2) как линейную комбинацию (1,0) и (0,1).","hint":"Координаты и есть коэффициенты.","a":"8(1,0)−2(0,1)."},{"id":"vector-2026-10-29-2","q":"Зависимы ли (2,4) и (1,2)? Запиши нетривиальное равенство.","hint":"Один — удвоенный другой.","a":"Да: (2,4)−2(1,2)=0."},{"id":"vector-2026-10-29-3","q":"Независимы ли (1,3) и (2,5)?","hint":"Найди определитель.","a":"1·5−3·2=−1≠0, независимы."},{"id":"vector-2026-10-29-4","q":"Могут ли три вектора в R² быть линейно независимы? Объясни.","hint":"Сравни число векторов и размерность.","a":"Нет: максимум два независимых направления."},{"id":"vector-2026-10-29-5","q":"Проверь, зависимы ли (1,0,1), (0,1,1), (1,1,2).","hint":"Попробуй сложить первые два.","a":"Да, третий — сумма первых двух."},{"id":"vector-2026-10-29-6","q":"Найди t, если (t,2) и (8,4) зависимы.","hint":"Приравняй детерминант к нулю.","a":"4t−16=0, t=4."},{"id":"vector-2026-10-29-7","q":"Покажи, что набор (0,0), (1,2) зависим.","hint":"Какие коэффициенты выбрать у нулевого вектора?","a":"1·(0,0)+0·(1,2)=0 — нетривиальная комбинация."},{"id":"vector-2026-10-29-8","q":"Представь (5,−1) через a=(1,1), b=(2,−1).","hint":"Реши систему x+2y=5, x−y=−1.","a":"x=1, y=2."},{"id":"vector-2026-10-29-9","q":"Исследуй независимость тройки (1,0,0), (0,1,0), (1,1,t) в R³.","hint":"Определитель матрицы со столбцами.","a":"Определитель равен t; независимы при t≠0."},{"id":"vector-2026-10-29-10","q":"Докажи: если a,b независимы, то a+b и a−b независимы.","hint":"Рассмотри x(a+b)+y(a−b)=0.","a":"(x+y)a+(x−y)b=0 ⇒ x+y=0 и x−y=0 ⇒ x=y=0."}]},"2026-10-30":{"topic":"Базис, координаты и смена базиса","place":"Пятница · дома 60 минут","sections":[["Линейная оболочка","Линейная оболочка набора векторов — множество всех их линейных комбинаций. Два неколлинеарных вектора на плоскости порождают всю плоскость, а два коллинеарных — только прямую через начало координат. Чтобы узнать, принадлежит ли вектор оболочке, нужно решить систему на коэффициенты его представления."],["Базис","Базис — набор векторов, который одновременно линейно независим и порождает всё пространство. В R² базис состоит из двух независимых векторов; в R³ — из трёх. Стандартный базис R²: e₁=(1,0), e₂=(0,1). Ключевое свойство: представление любого вектора через базис существует и единственно. Если независимость отсутствует, координаты могут быть неоднозначны; если порождение отсутствует, часть векторов представить вообще нельзя."],["Координаты относительно базиса","Координаты вектора зависят от выбранного базиса, хотя сам геометрический вектор остаётся тем же. Пусть b₁=(1,1), b₂=(1,−1). Вектор v=(4,2) записывается как 3b₁+1b₂, поэтому его координаты в этом базисе — (3,1). Не путай физические компоненты в стандартном базисе и коэффициенты разложения по новому базису."],["Матрица перехода","Если столбцы матрицы B состоят из координат базисных векторов в стандартном базисе, то v_std=B v_B. Чтобы найти v_B, решаем Bx=v_std или вычисляем x=B⁻¹v_std, если B обратима. Обратимость обеспечивается тем, что столбцы образуют базис. Главное — заранее укажи направление перехода: от координат в новом базисе к стандартным или наоборот."],["Смена базиса","Пусть старый базис представлен матрицей B, новый — матрицей C (оба относительно стандартных координат). Для одного и того же вектора B[v]_B=C[v]_C, поэтому [v]_C=C⁻¹B[v]_B. Эта запись объясняет, почему матрица перехода зависит от порядка базисов. Если перепутать направление, получится обратная матрица — одна из самых частых ошибок на контрольных."],["Ранг и базис оболочки","Когда векторов больше, чем необходимо, выбери независимые, которые порождают ту же оболочку. Их число — размерность оболочки, она же ранг матрицы, составленной из этих векторов в столбцы. Для подбора базиса удобно использовать метод Гаусса, а номера ведущих столбцов брать из исходной матрицы. Ведущие столбцы преобразованной матрицы не всегда годятся как исходный базис оболочки столбцов."],["Разобранный пример","Пусть b₁=(2,1), b₂=(1,1), а v=(5,3). Матрица B=[[2,1],[1,1]], её определитель 1, значит это базис. Решаем 2x+y=5, x+y=3. Вычитая второе из первого, получаем x=2, y=1. Таким образом [v]_B=(2,1). Проверка: 2(2,1)+(1,1)=(5,3)."],["Проверка перед контрольной","Убедись, что можешь: проверить базис определителем; найти координаты в другом базисе; восстановить стандартные координаты; построить матрицу перехода; объяснить, почему координаты единственны. Если появляются дроби, это нормально: координаты в произвольном базисе не обязаны быть целыми."],["Зачем одновременно нужны два условия базиса","Независимость гарантирует, что ни один базисный вектор нельзя получить из остальных, а порождение гарантирует, что любой требуемый вектор можно вообще выразить. Если убрать независимость, одно и то же движение может иметь разные координатные описания. Если убрать порождение, некоторые движения описать не получится. Например, в R² один ненулевой вектор независим, но не образует базис всей плоскости. А три вектора, среди которых стандартные e₁ и e₂, порождают плоскость, но зависимы. Поэтому при проверке базиса не ограничивайся лишь одной характеристикой."],["Связь с решением систем","Запись v=xb₁+yb₂ — это не что иное, как система линейных уравнений для неизвестных координат x и y. В столбцах матрицы стоят векторы базиса, справа — исходный вектор. Если детерминант ненулевой, система имеет единственное решение при любой правой части. Именно поэтому базис даёт координаты каждому вектору. Это связывает тему векторов с методом Гаусса: умение быстро решать системы превращается в умение мгновенно находить координаты в новом базисе."],["Почему порядок перехода важен","Представь, что один человек называет точку по координатам карты города, а другой — по системе осей, повернутых и растянутых относительно первой. Геометрическая точка не меняется, но её числовое описание зависит от системы. Для перехода от новых координат к стандартным нужно сложить базисные векторы с соответствующими коэффициентами, то есть умножить на B. Для обратного перехода нужно решить Bx=v, то есть применить B⁻¹. Перепутав направления, можно получить численно правдоподобный, но неверный результат."],["Как выбрать базис из большого набора","Если дан список из пяти векторов пространства R³, больше трёх независимых в нём не будет. Составь матрицу из столбцов и приведи к ступенчатому виду. Позиции ведущих столбцов покажут, какие столбцы исходной матрицы образуют базис её пространства столбцов. При этом элементарные преобразования строк сохраняют зависимости столбцов, но сами преобразованные столбцы описывают другое подпространство в исходных координатах. Поэтому указывай именно исходные векторы с найденными индексами."]],"formulas":[{"id":"auto-2026-10-30-0","title":"Разложение по базису","expression":"v=\\sum_i [v]_B^i b_i","category":"Линейная алгебра · Базис, координаты и смена базиса"},{"id":"auto-2026-10-30-1","title":"Из базисных координат","expression":"[v]_{std}=B[v]_B","category":"Линейная алгебра · Базис, координаты и смена базиса"},{"id":"auto-2026-10-30-2","title":"В базисные координаты","expression":"[v]_B=B^{-1}[v]_{std}","category":"Линейная алгебра · Базис, координаты и смена базиса"},{"id":"auto-2026-10-30-3","title":"Смена базиса","expression":"[v]_C=C^{-1}B[v]_B","category":"Линейная алгебра · Базис, координаты и смена базиса"},{"id":"auto-2026-10-30-4","title":"Критерий базиса Rⁿ","expression":"\\det B\\ne0","category":"Линейная алгебра · Базис, координаты и смена базиса"}],"tasks":[{"id":"vector-2026-10-30-1","q":"Являются ли (1,2),(2,1) базисом R²?","hint":"Вычисли определитель.","a":"Да, det=−3."},{"id":"vector-2026-10-30-2","q":"Найди координаты (5,3) в базисе (2,1),(1,1).","hint":"Реши систему.","a":"(2,1)."},{"id":"vector-2026-10-30-3","q":"Восстанови стандартный вектор, если b₁=(1,2), b₂=(2,0), а [v]_B=(3,−1).","hint":"Линейная комбинация.","a":"v=3(1,2)−(2,0)=(1,6)."},{"id":"vector-2026-10-30-4","q":"Проверь, порождают ли (1,0),(0,1),(1,1) всю R². Является ли тройка базисом?","hint":"Первые два уже образуют стандартный базис.","a":"Порождают, но тройка не базис: зависима."},{"id":"vector-2026-10-30-5","q":"В базисе b₁=(1,1), b₂=(1,−1) найди [v]_B для v=(6,2).","hint":"x+y=6, x−y=2.","a":"(4,2)."},{"id":"vector-2026-10-30-6","q":"Найди матрицу B для базиса (2,1),(1,3) и её определитель.","hint":"Столбцы — базисные векторы.","a":"B=[[2,1],[1,3]], det=5."},{"id":"vector-2026-10-30-7","q":"Найди координаты (1,0) в базисе (2,1),(1,3).","hint":"Реши Bx=(1,0).","a":"(3/5,−1/5)."},{"id":"vector-2026-10-30-8","q":"Выбери базис оболочки (1,0,1),(0,1,1),(1,1,2).","hint":"Третий — сумма первых двух.","a":"Первые два вектора; размерность оболочки 2."},{"id":"vector-2026-10-30-9","q":"Докажи единственность координат вектора в базисе.","hint":"Вычти два разложения и используй независимость.","a":"Если Σaᵢbᵢ=Σcᵢbᵢ, то Σ(aᵢ−cᵢ)bᵢ=0 ⇒ aᵢ=cᵢ."},{"id":"vector-2026-10-30-10","q":"Найди [v]_C для [v]_B=(2,3), B=I, C=[[1,1],[0,1]].","hint":"Реши Cx=(2,3).","a":"[v]_C=(−1,3)."}]},"2026-11-01":{"topic":"Контрольная по векторам: 10 задач","place":"Воскресенье · 09:30–12:45, включая перерыв","sections":[["Как устроен пробник","Сегодня не изучаем новую тему: за три часа повторяем векторы, скалярное произведение, зависимость и базисы. На первые 90 минут поставь таймер и решай задачи без учебника. Затем сделай перерыв, продолжи оставшиеся задачи и только после самостоятельных попыток открывай разборы. Такие пробники нужны не для идеального результата, а чтобы понять, какие операции уже автоматизированы, а где пока теряется логика."],["Порядок действий при вычислениях","Если задача содержит точки, сначала вычисли векторы как разности координат. При сложении и линейных комбинациях работай по компонентам. Если просят угол, проверь ненулевость векторов и переходи к скалярному произведению. Если спрашивают коллинеарность или линейную независимость, используй определитель или систему на коэффициенты. Для базиса помни два условия одновременно: независимость и порождение."],["Как оформлять решение","Пиши исходные данные, выбранную формулу, подстановку, вычисления и итог. Если есть параметр, перечисли особые случаи. Для доказательства сначала запиши, что именно необходимо доказать, а затем цепочку логически верных переходов. Фраза «очевидно» часто маскирует пропущенный шаг, особенно в задачах на независимость."],["Частые ошибки","Ошибка знака в AB=B−A, неверный знаменатель в проекции, деление на нулевую координату, путаница между координатами в разных базисах и предположение, что три вектора R² могут быть независимы. Для каждого промаха создай запись в журнале ошибок. После пробника вернись к задачам, которые не получилось решить, и восстанови полное решение без подглядывания."],["Самопроверка понятий","Ответь устно: чем свободный вектор отличается от точки? Что значит ортогональность? Почему ненулевой определитель двух плоских векторов означает независимость? Почему у вектора в базисе ровно один набор координат? Как связаны длина и скалярное произведение? Если какая-то формулировка не получается, найди её в теории соответствующего дня."],["Оценка контрольной","8–10 полностью верных решений — отличный старт; 6–7 — рабочая база, стоит повторить слабые темы; меньше 6 — раздел нужно закрепить прежде чем двигаться дальше. Это учебные ориентиры, а не оценки университета. Важнее полнота рассуждений: ответ без объяснения может быть недостаточен для задач на доказательство."],["План разбора","После пробника раздели ошибки на четыре группы: незнание определения, неправильно выбранная формула, вычислительная ошибка, неаккуратное оформление. Дальше назначь каждой проблемной теме два дополнительных упражнения. При необходимости следующую среду можно посвятить именно слабому пункту, не разрушая общий график."],["Итог недели","В идеале к концу занятия ты свободно вычисляешь векторы по координатам, углы и проекции, умеешь исследовать линейную зависимость и переводить координаты между базисами. Этот набор навыков будет опорой для матриц, линейных отображений и собственных значений. Не пытайся закрыть всё любой ценой: если устала, зафиксируй неразобранные задачи и вернись к ним на следующем занятии."],["Перед началом самостоятельной работы","Раздели лист на две части: вычисления и пояснения. Не открывай подсказки до окончания основного блока. Если одна задача забирает больше 15 минут и прогресса нет, поставь рядом вопросительный знак и временно переключись. Так ты получишь честную картину владения темами. Для письменной контрольной важна также скорость: простые вычисления должны занимать несколько минут, чтобы оставалось время на объяснение сложных доказательств. Записывай промежуточные результаты, иначе проверить ошибку знака будет трудно."],["План проверки ответов","Сначала перепроверь каждый результат независимо. Для линейной комбинации снова подставь найденные коэффициенты в исходное выражение. Для угла оцени знак косинуса и убедись, что он соответствует геометрии. Для коллинеарности проверь координатную пропорцию или определитель. Для базиса найди определитель и убедись в его ненулевости. Для проекции вычти её из исходного вектора и убедись, что разность ортогональна направлению проекции. Эти способы проверки лучше, чем простое повторение тех же арифметических действий."],["Как разбирать ошибки с пользой","Разбирая неправильную задачу, начни с первого неверного перехода, а не с последнего ответа. Если формула верна, но арифметика подвела, поставь отметку «вычислительная ошибка». Если выбрана неправильная идея, возвращайся к определению и повтори рассуждение с простыми числами. Если трудно оформить доказательство, выпиши логическую схему «дано — нужно — утверждение — обоснование». Через день реши аналогичную задачу с изменёнными числами, чтобы проверить, поняла ли метод, а не запомнила ответ."],["Критерий готовности к следующему разделу","Перед переходом к матрицам и линейным отображениям стоит добиться уверенности хотя бы в вычислении координат, скалярного произведения, проверке зависимости и поиске координат в новом базисе. Если ты решаешь вычислительные пункты, но теряешься на доказательствах, запланируй ещё одну короткую тренировку именно на аргументацию. Если сложность вызвана только арифметикой, достаточно регулярного повторения на простых примерах. Твоё расписание оставляет возможность укрепить базу, не перегружая поздние вечера."]],"formulas":[{"id":"auto-2026-11-01-0","title":"Длина","expression":"\\|a\\|=\\sqrt{\\sum_i a_i^2}","category":"Линейная алгебра · Контрольная по векторам: 10 задач"},{"id":"auto-2026-11-01-1","title":"Угол","expression":"\\cos\\varphi=\\frac{a\\cdot b}{\\|a\\|\\|b\\|}","category":"Линейная алгебра · Контрольная по векторам: 10 задач"},{"id":"auto-2026-11-01-2","title":"Проекция","expression":"\\operatorname{proj}_b a=\\frac{a\\cdot b}{b\\cdot b}b","category":"Линейная алгебра · Контрольная по векторам: 10 задач"},{"id":"auto-2026-11-01-3","title":"Независимость","expression":"\\det B\\ne0","category":"Линейная алгебра · Контрольная по векторам: 10 задач"},{"id":"auto-2026-11-01-4","title":"Координаты в базисе","expression":"[v]_B=B^{-1}v","category":"Линейная алгебра · Контрольная по векторам: 10 задач"}],"tasks":[{"id":"vector-2026-11-01-1","q":"A=(−1,2), B=(4,6). Найди AB и его длину.","hint":"Конец минус начало.","a":"AB=(5,4), длина √41."},{"id":"vector-2026-11-01-2","q":"Вычисли 2(1,−3,2)−(4,0,−1).","hint":"Покомпонентно.","a":"(−2,−6,5)."},{"id":"vector-2026-11-01-3","q":"Найди угол между (1,1) и (1,−1).","hint":"Скалярное произведение.","a":"90°."},{"id":"vector-2026-11-01-4","q":"При каком t векторы (2,t,1) и (t,2,0) перпендикулярны?","hint":"2t+2t.","a":"t=0."},{"id":"vector-2026-11-01-5","q":"Найди проекцию (3,5) на направление (1,1).","hint":"Используй b·b=2.","a":"(4,4)."},{"id":"vector-2026-11-01-6","q":"При каком t векторы (t,3) и (2,6) зависимы?","hint":"Определитель ноль.","a":"t=1."},{"id":"vector-2026-11-01-7","q":"Независимы ли (1,0,1), (0,1,1), (1,1,0) в R³?","hint":"Определитель столбцов.","a":"Да, det=−2."},{"id":"vector-2026-11-01-8","q":"Являются ли (1,2) и (3,5) базисом R²? Найди det.","hint":"Ненулевой det.","a":"det=−1, да."},{"id":"vector-2026-11-01-9","q":"В базисе (1,1),(1,−1) найди координаты v=(8,2).","hint":"Реши систему x+y=8, x−y=2.","a":"(5,3)."},{"id":"vector-2026-11-01-10","q":"Докажи, что векторы a,b,a+b линейно зависимы для любых a,b.","hint":"Запиши комбинацию, равную нулю.","a":"a+b−(a+b)=0, коэффициенты (1,1,−1) нетривиальны."}]}};
