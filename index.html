const EARLY_ANALYSIS = {"2026-10-28": {"topic": "Матанализ: производные, цепное правило, касательная", "place": "Среда: 18:00–20:00 (по самочувствию)", "sections": [["Смысл производной и условия существования", "Производная измеряет мгновенную скорость изменения функции. Формально это предел отношения приращения функции к приращению аргумента. Если он конечен, существует касательная с конечным угловым коэффициентом. Дифференцируемость в точке гарантирует непрерывность в этой точке, но непрерывность сама по себе не гарантирует дифференцируемость. Например, модуль |x| непрерывен в нуле, но его левый и правый наклоны различаются. При решении экзаменационных задач сначала проверь область определения, затем места разрыва, излома или вертикальной касательной. Не стоит механически пользоваться производными там, где функция не определена или не дифференцируема."], ["Правила и цепное правило", "Производная суммы — сумма производных; постоянный множитель выносится; для произведения действует сумма двух слагаемых, в каждом из которых продифференцирован один из множителей. Для частного нужен квадрат знаменателя, а знак между произведениями в числителе отрицательный. Цепное правило применяется когда функция составлена из вложенных выражений: сначала производная внешней функции при неизменном внутреннем выражении, затем умножение на производную внутреннего. Для выражения ln(1+x²) внешняя функция — логарифм, внутренняя — 1+x². В результате получаем 2x/(1+x²). Обязательно выделяй внутренние слои, особенно в выражениях вроде sin((x²+1)³)."], ["Производная как геометрический инструмент", "Прямая y=kx+b касается графика в точке x0, когда проходит через (x0,f(x0)) и её наклон k равен f’(x0) в обычной ситуации с дифференцируемой функцией. Уравнение касательной имеет вид y=f(x0)+f’(x0)(x−x0). Нормаль перпендикулярна касательной и при ненулевом k имеет наклон −1/k; при горизонтальной касательной нормаль вертикальна. Знак производной помогает исследовать монотонность функции на интервалах: положительная производная означает возрастание, отрицательная — убывание. Но одного значения производной в точке недостаточно для выводов об экстремуме; исследуй знак слева и справа."], ["Критические точки и экстремумы", "Критические точки — внутренние точки области определения, где производная равна нулю или не существует. Они кандидаты на локальные экстремумы, но не обязательно экстремумы. Чтобы найти максимум или минимум на отрезке, посчитай значения функции во всех внутренних критических точках и на концах отрезка; затем сравни результаты. Для локального анализа удобно составить таблицу знаков производной. Если знак меняется с плюса на минус, это максимум; с минуса на плюс — минимум. Когда знак не меняется, экстремума может не быть. При исследовании функции x³ в нуле производная равна нулю, однако функция продолжает возрастать."], ["Подробный пример", "Рассмотрим f(x)=x·e^(x²). Это произведение x и e^(x²). По правилу произведения f’(x)=1·e^(x²)+x·(e^(x²))’. По цепному правилу (e^(x²))’=e^(x²)·2x. Следовательно f’(x)=e^(x²)(1+2x²). Поскольку экспонента всегда положительна, а 1+2x² строго положительно для любого действительного x, функция строго возрастает на всей прямой. Производная не обращается в ноль, и локальных экстремумов нет. Этот пример объединяет вычислительную технику, цепное правило и качественный анализ функции."], ["Частые ошибки и самостоятельная проверка", "Типичные ошибки: забыть внутреннюю производную, заменить производную произведения произведением производных, потерять минус в производной косинуса, применять логарифм вне области определения или объявить каждую стационарную точку экстремумом. После вычисления попробуй проверку: у производной x^n степень обычно на единицу меньше; у сложной функции должен появиться множитель от внутреннего аргумента; производная e^x положительна, а функция e^x возрастает. При затруднении проговори алгоритм словами: определить структуру, выбрать правило, вычислить по слоям, упростить и проверить область определения."]], "formulas": [{"id": "auto-deriv-definition", "category": "Матанализ", "title": "Определение производной", "expression": "f'(x_0)=\\lim_{h\\to0}\\frac{f(x_0+h)-f(x_0)}{h}"}, {"id": "auto-product-rule", "category": "Матанализ", "title": "Правило произведения", "expression": "(uv)'=u'v+uv'"}, {"id": "auto-chain-rule", "category": "Матанализ", "title": "Цепное правило", "expression": "(f\\circ g)'(x)=f'(g(x))g'(x)"}, {"id": "auto-tangent", "category": "Матанализ", "title": "Касательная", "expression": "y=f(x_0)+f'(x_0)(x-x_0)"}], "tasks": [{"id": "analysis-28-0", "q": "Найди производную f(x)=x³sin x.", "hint": "Правило произведения.", "a": "3x²sin x+x³cos x."}, {"id": "analysis-28-1", "q": "Найди производную f(x)=ln(1+3x²).", "hint": "Цепное правило.", "a": "6x/(1+3x²)."}, {"id": "analysis-28-2", "q": "Найди производную f(x)=e^(2x)cos x.", "hint": "Правило произведения и цепное.", "a": "e^(2x)(2cos x−sin x)."}, {"id": "analysis-28-3", "q": "Найди производную f(x)=sqrt(4+x²).", "hint": "Степень 1/2 и цепное правило.", "a": "x/sqrt(4+x²)."}, {"id": "analysis-28-4", "q": "Составь касательную к f(x)=x²−3x в точке x=2.", "hint": "Найди f(2) и f’(2).", "a": "f(2)=−2, f’(2)=1, y=x−4."}, {"id": "analysis-28-5", "q": "Найди критические точки f(x)=x³−6x²+9x.", "hint": "Приравняй производную к нулю.", "a": "f’=3(x−1)(x−3); x=1 и x=3."}, {"id": "analysis-28-6", "q": "Где возрастает f(x)=x³−3x?", "hint": "Таблица знаков f’.", "a": "Возрастает на (−∞,−1) и (1,+∞)."}, {"id": "analysis-28-7", "q": "Найди максимум f(x)=−x²+4x+1 на [0,5].", "hint": "Вершина параболы либо производная.", "a": "Максимум равен 5 при x=2."}, {"id": "analysis-28-8", "q": "Докажи, что e^x≥1+x для всех действительных x.", "hint": "Исследуй g(x)=e^x−x−1.", "a": "g’=e^x−1; минимум при x=0, g(0)=0."}, {"id": "analysis-28-9", "q": "Проверь, есть ли производная у f(x)=|x−2| при x=2.", "hint": "Сравни односторонние производные.", "a": "Нет: слева −1, справа +1."}]}, "2026-10-30": {"topic": "Матанализ: теоремы Ролля и Лагранжа", "place": "Пятница: 60 минут дома, часть задач можно перенести на воскресенье", "sections": [["От локального наклона к теоремам", "Теорема Ферма: если дифференцируемая функция имеет локальный экстремум во внутренней точке, то производная в этой точке равна нулю. Это необходимое условие, но не достаточное. Теорема Ролля утверждает: если функция непрерывна на закрытом отрезке, дифференцируема внутри и значения на концах равны, то хотя бы в одной внутренней точке производная равна нулю. Обязательные условия нельзя опускать: например, для функции с изломом или разрывом заключение может быть неверным."], ["Теорема Лагранжа", "Теорема Лагранжа утверждает, что для функции, непрерывной на [a,b] и дифференцируемой на (a,b), существует точка c внутри интервала, для которой производная в c равна средней скорости изменения на отрезке: f’(c)=(f(b)−f(a))/(b−a). Геометрически это означает, что где-то касательная параллельна секущей через концы графика. При решении сначала выпиши условия, затем вычисли средний наклон и реши уравнение f’(c)=k, проверяя, что c лежит строго между a и b. Теорема обещает существование хотя бы одной точки, но иногда таких точек несколько."], ["Как доказывают следствия", "Теорема Лагранжа даёт мощные оценки. Если на отрезке |f’(x)|≤M, то |f(b)−f(a)|≤M|b−a|: достаточно применить теорему к паре точек и взять модуль. Если производная положительна на интервале, функция строго возрастает, а если нулевая на всём интервале, функция постоянна. Это хороший инструмент для неравенств, уникальности корней и сравнения функций. При доказательстве неравенства часто полезно ввести разность g(x)=левая часть−правая часть и изучить её производную."], ["Как применяется Ролль", "Чтобы доказать, что у уравнения не более одного корня на интервале, предположи противное: есть два разных корня a и b. Если условия Ролля выполняются, найдётся точка c между ними с f’(c)=0. Если по условию производная нигде не равна нулю, получаем противоречие. Для оценки числа корней можно применить идею несколько раз и использовать свойства производной. Это не вычислительный трюк, а способ связать значения функции и её наклоны."], ["Разобранный пример", "Пусть f(x)=ln x на [1,e]. Она непрерывна на отрезке и дифференцируема внутри, так как x>0. Средний наклон равен (ln e−ln 1)/(e−1)=1/(e−1). Производная f’(x)=1/x. Значит, 1/c=1/(e−1), поэтому c=e−1. Число e−1 действительно лежит между 1 и e; это проверяет последнее требование. Если бы мы механически нашли c, не проверив попадание в интервал, решение было бы неполным."], ["Что нужно помнить перед контрольной", "Проверяй, открыт или закрыт интервал и допускаются ли концы при выборе точки c. Теорема Лагранжа не позволяет просто подставить любую точку: она гарантирует существование нужной точки. Если функция не дифференцируема в одной из внутренних точек, теорему в обычной форме применять нельзя. Для задач с неравенствами полезно сравнить производные двух функций, используя монотонность разности. Для подготовки к ШАДу особенно важно уметь не только применять формулу, но и обосновывать каждую гипотезу теоремы."]], "formulas": [{"id": "auto-lagrange", "category": "Матанализ", "title": "Теорема Лагранжа", "expression": "f'(c)=\\frac{f(b)-f(a)}{b-a}"}, {"id": "auto-rolles", "category": "Матанализ", "title": "Теорема Ролля", "expression": "f(a)=f(b)\\Longrightarrow\\exists c\\in(a,b):f'(c)=0"}, {"id": "auto-mean-bound", "category": "Матанализ", "title": "Оценка по производной", "expression": "|f(b)-f(a)|\\le M|b-a|"}], "tasks": [{"id": "analysis-30-0", "q": "Проверь условия теоремы Ролля для f(x)=x²−4x+3 на [1,3] и найди c.", "hint": "Концы равны нулю, f’=2x−4.", "a": "Условия выполняются; c=2."}, {"id": "analysis-30-1", "q": "Примени теорему Лагранжа к f(x)=x² на [1,4]; найди c.", "hint": "Средний наклон равен 5.", "a": "2c=5, c=5/2."}, {"id": "analysis-30-2", "q": "Примени теорему Лагранжа к f(x)=ln x на [1,e].", "hint": "f’=1/x.", "a": "c=e−1."}, {"id": "analysis-30-3", "q": "Почему нельзя применить Ролля к f(x)=|x| на [−1,1]?", "hint": "Проверь дифференцируемость внутри.", "a": "Не существует производной при x=0."}, {"id": "analysis-30-4", "q": "Докажи, что функция x³+x строго возрастает.", "hint": "Исследуй производную.", "a": "3x²+1>0 для всех x."}, {"id": "analysis-30-5", "q": "Докажи |sin a−sin b|≤|a−b|.", "hint": "Применяй Лагранжа и |cos c|≤1.", "a": "По Лагранжу разность равна cos(c)(a−b), берём модуль."}, {"id": "analysis-30-6", "q": "У f(x)=x³−3x сколько стационарных точек?", "hint": "Реши 3x²−3=0.", "a": "Две: x=−1, x=1."}, {"id": "analysis-30-7", "q": "Найди c из теоремы Лагранжа для f(x)=1/x на [1,2].", "hint": "Средняя скорость −1/2.", "a": "−1/c²=−1/2, значит c=√2."}, {"id": "analysis-30-8", "q": "Докажи: если f’(x)=0 на интервале, то f постоянна.", "hint": "Возьми две произвольные точки и применяй Лагранжа.", "a": "f(b)−f(a)=f’(c)(b−a)=0."}, {"id": "analysis-30-9", "q": "Объясни, почему x² на [−1,1] удовлетворяет Роллю, но не является монотонной.", "hint": "Найди c, посмотри знаки производной.", "a": "c=0, функция убывает на (−1,0), возрастает на (0,1)."}]}};
