und:linear-gradient(135deg,#40204f,#7b2f79,#d35c67);color:#fff;padding:12px 18px;border-radius:12px;display:none;box-shadow:0 18px 40px rgba(43,13,50,.24)}.hide{display:none}.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}.datebox{padding:10px;border:1px solid rgba(132,76,168,.14);border-radius:12px;background:rgba(255,255,255,.85);font:inherit;max-width:100%}.section{display:none}.section.active{display:block}input,textarea{color:var(--ink)}.footer-note{margin-top:16px;font-size:12px;color:rgba(255,235,244,.76)}@media(max-width:950px){.layout{grid-template-columns:1fr}.sidebar{height:auto;position:static;display:block;padding:16px;border-right:0;border-bottom:1px solid rgba(255,255,255,.08)}.brand{margin:0 0 12px}.menu{display:flex;overflow-x:auto;gap:5px}.nav{width:auto;white-space:nowrap}.sidefoot{display:none}.content{padding:22px 16px 50px}.days{grid-template-columns:repeat(4,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr 1fr}.days{grid-template-columns:repeat(2,1fr)}.road{grid-template-columns:1fr}h1{font-size:27px}.heading{flex-direction:column}.card{padding:17px}.day{min-height:118px}}

еши систему: x+y=3; 2x−y=0", "x=1, y=2"], ["Найди собственные значения матрицы [[2,1],[1,2]]", "1 и 3"]]}, "2026-10-29": {"topic": "Производные: закрепление", "place": "Дорога: 15 мин · дома: 60 мин", "theory": "Повтори цепное правило и правило произведения; не изучай много нового.", "tasks": [["Найди производную: f(x)=e^(2x) ln(1+x²)", "e^(2x)(2ln(1+x²)+2x/(1+x²))"], ["Исследуй f(x)=x³−3x²+2 на возрастание и убывание", "Возрастает (-∞,0) и (2,∞); убывает (0,2)"], ["Докажи e^x≥1+x для всех x", "Минимум e^x−x−1 равен 0 при x=0"]]}, "2026-10-30": {"topic": "Комбинаторика / алгоритмы", "place": "Дома: 60 мин", "theory": "Правило суммы и произведения в комбинаторике, сочетания.", "tasks": [["Сколько 6-значных строк из цифр содержат ровно две единицы?", "C(6,2)·9^4 = 98 415"], ["Сколько способов выбрать 3 человек из 10?", "120"]]}, "2026-11-01": {"topic": "Большой математический практикум", "place": "09:30–12:45 (3 ч учёбы + перерыв)", "theory": "Разбор ошибок недели, свойства производной и матриц.", "tasks": [["Вычисли производную f(x)=sin(x²)·e^x", "e^x(2x cos(x²)+sin(x²))"], ["Найди экстремумы f(x)=x³−3x", "Максимум при x=−1, минимум при x=1"], ["Найди определитель [[1,2],[3,4]]", "−2"], ["Объясни своими словами, зачем нужен ранг матрицы", "Размерность пространства столбцов / строк"]]}, "2026-11-03": {"topic": "Математический анализ", "place": "Дома: 90 мин · дорога по желанию", "theory": "Повторение изученных определений; далее следующий раздел анализа.", "tasks": [["Реши 4–6 задач из текущего раздела", "Сверь с конспектом и разбором"]]}, "2026-11-04": {"topic": "Линейная алгебра", "place": "Дома: 2 часа", "theory": "Ранг, ядро, базис и линейные отображения.", "tasks": [["Реши 3 задачи на ранг и базисы", "Проверь методом Гаусса"]]}, "2026-11-05": {"topic": "Закрепление анализа", "place": "Дома: 60 мин", "theory": "Повтори вторничные ошибки.", "tasks": [["Реши 3 задачи без подсказок", "Зафиксируй решения"]]}, "2026-11-06": {"topic": "Комбинаторика / алгоритмы", "place": "Дома: 60 мин", "theory": "Чередуй комбинаторику и алгоритмические задачи.", "tasks": [["Реши 2 задачи с объяснением идеи", "Оцени асимптотику при необходимости"]]}, "2026-11-08": {"topic": "Большой практикум", "place": "09:30–12:45", "theory": "Повторение материала недели и работа над ошибками.", "tasks": [["Сделай самостоятельный мини-пробник", "Разбери ошибки"]]}};
const MENU=[['today','Сегодня'],['roadmap','План до поступления'],['week','Ближайшая неделя'],['calendar','Календарь'],['errors','Журнал ошибок'],['theory','Теория и материалы'],['tasks','Задачи дня'],['notes','Конспекты'],['formulas','Формулы'],['sync','Синхронизация']];
const DAYS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const dayStr=d=>{const z=new Date(d);return z.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateOf=s=>new Date(s+'T12:00:00');
const defaultDate='2026-10-27';
let state={done:{},notes:{},customTasks:{},customTheory:{},errors:[],date:defaultDate};
try{const x=JSON.parse(localStorage.getItem('shad-2026-v1'));if(x&&typeof x==='object')state={...state,...x,errors:Array.isArray(x.errors)?x.errors:[]}}catch(e){}
let tab='today';let answerVisible={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem('shad-2026-v1',JSON.stringify(state));queueCloudSave()}
function toast(s){const t=document.getElementById('toast');t.innerText=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function weekStart(d){const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function template(date){const dt=dateOf(date);let wd=dt.getDay();if(wd===1||wd===6)return {topic:'Отдых',place:'Без обязательных занятий',theory:'Сегодня можно восстановить силы.',tasks:[]};let opts={2:['Матанализ','После университета · 90 минут'],3:['Линейная алгебра','После 17:30 · 2 часа'],4:['Повторение матанализа','Дома · 60 минут'],5:['Комбинаторика / алгоритмы','Дома · 60 минут'],0:['Большой практикум','До 14:00 · 3 часа']};let v=opts[wd];return {topic:v[0],place:v[1],theory:'Выбери тему текущего месяца из долгосрочного плана. Добавь конкретные задачи вместе с ChatGPT через редактирование плана.',tasks:[]}}
function lesson(date=state.date){return LESSONS[date]||template(date)}
function tasks(date=state.date){return [...lesson(date).tasks.map((t,i)=>({id:'seed'+i,q:t[0],a:t[1]})),...(state.customTasks[date]||[])]}
function completeCount(date=state.date){return tasks(date).filter(t=>state.done[date+':'+t.id]).length}

function changeTab(v){tab=v;answerVisible={};render()}
function nav(){document.getElementById('menu').innerHTML=MENU.map(([id,t])=>`<button class="nav ${tab===id?'active':''}" onclick="changeTab('${id}')">${esc(t)}</button>`).join('')}

function dateControl(){return `<div class="topbar"><span class="chip">${esc(dayStr(state.date))}</span><input class="datebox" type="date" value="${esc(state.date)}" onchange="setDate(this.value)"></div>`}
function getRoadmapTopic(date){let d=dateOf(date);let idx=(d.getFullYear()-2026)*12+d.getMonth()-10;return ROADMAP[Math.max(0,Math.min(ROADMAP.length-1,idx))]?.[1]||'Подготовка к ШАДу'}
function calendarHtml(){let d=dateOf(state.date),first=new Date(d.getFullYear(),d.getMonth(),1),offset=(first.getDay()+6)%7,last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let cells=Array.from({length:offset},()=>'<div class="calempty"></div>');for(let n=1;n<=last;n++){let dd=iso(new Date(d.getFullYear(),d.getMonth(),n)),l=lesson(dd),total=tasks(dd).length,done=completeCount(dd);cells.push(`<button class="calday ${dd===state.date?'selected':''}" onclick="setDate('${dd}');changeTab('today')"><b>${n}</b><small>${esc(l.topic)}</small>${total?`<span class="chip">${done}/${total} задач</span>`:''}</button>`)}return `<div class="card"><div class="topbar"><h2>${first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h2><div class="buttonrow"><button class="btn" onclick="shiftMonth(-1)">←</button><button class="btn" onclick="shiftMonth(1)">→</button></div></div><p class="sub">Нажми на дату, чтобы открыть задания и конспект. По понедельникам и субботам — отдых.</p><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells.join('')}</div></div>`}
function shiftMonth(dir){let d=dateOf(state.date);d.setDate(1);d.setMonth(d.getMonth()+dir);setDate(iso(d))}
function errorHtml(){let a=state.errors||[];return `<div class="card"><h2>Журнал ошибок</h2><p class="sub">Записывай трудные задачи и повторяй их через несколько дней. Всё сохраняется вместе с остальным прогрессом.</p><label class="tiny muted">Тема / задача</label><input id="errTitle" class="datebox" style="width:100%;margin:8px 0" placeholder="Например: цепное правило"><label class="tiny muted">Что пошло не так и какая правильная идея?</label><textarea id="errBody" class="note" style="min-height:95px" placeholder="Ошибка, решение и что повторить"></textarea><div class="buttonrow"><button class="btn primary" onclick="addError()">+ Добавить ошибку</button></div></div><div class="card"><h2>На повторение · ${a.length}</h2>${a.length?a.slice().reverse().map(e=>`<div class="listitem"><div style="flex:1"><b>${esc(e.title)}</b><p class="sub">${esc(e.body)}</p><p class="tiny muted">${esc(e.date)} · ${e.reviewed?'Повторено':'Ожидает повторения'}</p><button class="btn" onclick="markError('${e.id}')">${e.reviewed?'Вернуть в работу':'Отметить повторённым'}</button> <button class="btn" onclick="removeError('${e.id}')">Удалить</button></div></div>`).join(''):'<p class="sub">Ошибок пока нет. Добавь первую после решения задачи.</p>'}</div>`}
function addError(){let t=document.getElementById('errTitle').value.trim(),b=document.getElementById('errBody').value.trim();if(!t)return toast('Укажи тему или задачу');state.errors.push({id:'e'+Date.now(),title:t,body:b,date:state.date,reviewed:false});persist();render();toast('Запись добавлена')}
function markError(id){state.errors=state.errors.map(e=>e.id===id?{...e,reviewed:!e.reviewed}:e);persist();render()}
function removeError(id){state.errors=state.errors.filter(e=>e.id!==id);persist();render()}
function progressCard(){let t=tasks();let n=completeCount();return `<div class="card"><div class="topbar"><b>${esc(lesson().topic)}</b><span class="chip pill">${esc(lesson().place)}</span></div><div class="muted tiny">Прогресс задач за выбранный день</div><div class="progress"><div class="fill" style="width:${t.length?n/t.length*100:0}%"></div></div><div class="tiny muted">${n} из ${t.length} задач выполнено</div></div>`}
function tasksHtml(){let t=tasks();return `<div class="card"><div class="topbar"><h2>Задачи на день</h2><span class="muted tiny">${completeCount()}/${t.length}</span></div>${t.length?t.map((x,i)=>`<div class="listitem"><input class="check" type="checkbox" ${state.done[state.date+':'+x.id]?'checked':''} onchange="toggleTask('${x.id}',this.checked)"><div style="flex:1"><div class="tasktitle">${esc(x.q)}</div><div class="buttonrow" style="margin-top:8px"><button class="btn" onclick="toggleAnswer('${x.id}')">${answerVisible[x.id]?'Скрыть':'Проверить ответ'}</button>${x.id.startsWith('custom')?`<button class="btn" onclick="deleteTask('${x.id}')">Удалить</button>`:''}</div>${answerVisible[x.id]?`<div class="answer">${esc(x.a||'Ответ не добавлен — разберём вместе.')}</div>`:''}</div></div>`).join(''):'<p class="sub">На эту дату задачи пока не назначены. Можно добавить свои ниже.</p>'}<h3 style="margin-top:17px">Добавить задачу</h3><textarea id="newTask" class="note" style="min-height:67px" placeholder="Условие задачи"></textarea><input id="newAnswer" class="datebox" style="display:block;width:100%;margin:8px 0 12px" placeholder="Ответ или подсказка (необязательно)"><button class="btn primary" onclick="addTask()">+ Добавить задачу</button></div>`}
function theoryHtml(){let l=lesson();return `<div class="card"><h2>${esc(l.topic)}</h2><p class="sub">${esc(l.theory)}</p><h3 style="margin-top:23px">Видео и учебные материалы</h3><a class="link" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=YG15m2VwSjA">▶ 3Blue1Brown — цепное правило и правило произведения</a><a class="link" target="_blank" rel="noopener" href="https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/pages/1.-differentiation/">↗ MIT OCW — производные: лекции, задания, конспекты</a><a class="link" target="_blank" rel="noopener" href="https://shad.yandex.ru/enroll/">↗ ШАД — поступление и официальная программа</a><p class="muted tiny">Видео 3Blue1Brown и материалы MIT преимущественно на английском; некоторые ролики могут иметь субтитры.</p><h3 style="margin-top:22px">Личный план теории на эту дату</h3><textarea id="customTheory" class="note" placeholder="Добавь свои пояснения и ссылки. Например: повторить формулу касательной.">${esc(state.customTheory[state.date]||'')}</textarea><div style="margin-top:10px"><button class="btn primary" onclick="saveTheory()">Сохранить</button></div></div>`}
function noteHtml(){return `<div class="card"><h2>Конспект: ${esc(dayStr(state.date))}</h2><p class="sub" style="margin-bottom:15px">Записывай определения, решения, ошибки и собственные вопросы. Используй выбор даты, чтобы открыть другой конспект.</p><textarea id="noteText" class="note" style="min-height:350px" placeholder="Сегодня я изучила…&#10;Главная идея…&#10;Что осталось непонятным…">${esc(state.notes[state.date]||'')}</textarea><div style="margin-top:12px" class="buttonrow"><button class="btn primary" onclick="saveNote()">Сохранить конспект</button><button class="btn" onclick="changeTab('formulas')">Открыть формулы</button></div></div>`}
function formulasHtml(){let groups=[['Дифференцирование',[['Сумма','(u + v)′ = u′ + v′'],['Произведение','(uv)′ = u′v + uv′'],['Частное','(u/v)′ = (u′v − uv′)/v²'],['Сложная функция','(f(g(x)))′ = f′(g(x))·g′(x)'],['Степенная','(xⁿ)′ = nxⁿ⁻¹'],['Экспонента','(eˣ)′ = eˣ'],['Логарифм','(ln x)′ = 1/x'],['Синус','(sin x)′ = cos x'],['Касательная','y = f(x₀) + f′(x₀)(x − x₀)']]],['Линейная алгебра',[['Определитель 2×2','det [[a,b],[c,d]] = ad − bc'],['Размерность','dim ker(A) + rank(A) = n'],['Собственные значения','det(A − λI) = 0']]],['Вероятность (на будущее)',[['Условная вероятность','P(A|B) = P(A∩B)/P(B)'],['Байес','P(A|B) = P(B|A)P(A)/P(B)'],['Дисперсия','Var(X) = E(X²) − (E(X))²']]]];return groups.map(([name,ls])=>`<div class="card"><h2>${name}</h2>${ls.map(([a,b])=>`<div class="formula"><span class="tiny muted">${a}</span><code>${esc(b)}</code></div>`).join('')}</div>`).join('')}
function weekHtml(){let monday=weekStart(dateOf(state.date));let cards=Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);let id=iso(d),l=lesson(id);return `<button class="day ${id===state.date?'selected':''} ${[0,5].includes(i)?'off':''}" onclick="setDate('${id}');changeTab('today')"><strong>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]} · ${d.getDate()}</strong><span class="bubble">${esc(l.topic)}</span><small>${esc(l.place)}</small><small>${completeCount(id)}/${tasks(id).length} задач</small></button>`}).join('');return `<div class="card"><h2>Неделя: ${esc(dayStr(iso(monday)))}</h2><p class="sub" style="margin-bottom:16px">Нажми на день, чтобы перейти к его теории и заданиям.</p><div class="days">${cards}</div><div class="buttonrow" style="margin-top:20px"><button class="btn" onclick="shiftWeek(-7)">← Предыдущая</button><button class="btn" onclick="shiftWeek(7)">Следующая →</button></div></div>`}
function roadHtml(){return `<div class="grid"><div class="card"><div class="muted tiny">Цель</div><div class="stat">2028</div><p class="sub">Поступить в Школу анализа данных</p></div><div class="card"><div class="muted tiny">Дома</div><div class="stat">8,5 ч</div><p class="sub">Средняя недельная нагрузка</p></div><div class="card"><div class="muted tiny">В дороге</div><div class="stat">2–3 ч</div><p class="sub">Лёгкое повторение по самочувствию</p></div></div><div class="card"><h2>Долгосрочный учебный план</h2><p class="sub" style="margin-bottom:18px">Основа до апреля 2028, затем участие в отборе по актуальному расписанию. Этапы редактируем вместе по мере прогресса.</p><div class="road">${ROADMAP.map(([m,t],i)=>`<div class="roaditem"><span class="chip">Месяц ${i+1}</span><p><b>${esc(m)}</b></p><p>${esc(t)}</p></div>`).join('')}</div></div>`}
function todayHtml(){let l=lesson(),unfinished=(state.errors||[]).filter(e=>!e.reviewed).length;return dateControl()+`<div class="card feature"><div class="tiny muted">УЧЕБНЫЙ ПЛАН · ${esc(dayStr(state.date))}</div><h2>${esc(l.topic)}</h2><p>${esc(l.theory)}</p><p class="sub">${esc(l.place)}</p><div class="buttonrow"><button class="btn primary" onclick="changeTab('theory')">Читать теорию</button><button class="btn" onclick="changeTab('tasks')">Решать задачи</button><button class="btn" onclick="changeTab('calendar')">Календарь</button></div></div>`+progressCard()+`<div class="grid"><div class="card"><div class="muted tiny">Тема текущего этапа</div><h3>${esc(getRoadmapTopic(state.date))}</h3></div><div class="card"><div class="muted tiny">Ошибки на повторение</div><div class="stat">${unfinished}</div><button class="btn" onclick="changeTab('errors')">Открыть журнал →</button></div><div class="card"><div class="muted tiny">Конспект на дату</div><h3>${state.notes[state.date]?'Уже есть':'Пока пустой'}</h3><button class="btn" onclick="changeTab('notes')">Добавить запись →</button></div></div>`+weekHtml()+tasksHtml()}

function render(){nav();heading();let html={today:todayHtml,week:()=>dateControl()+weekHtml(),calendar:()=>dateControl()+calendarHtml(),errors:errorHtml,roadmap:roadHtml,theory:()=>dateControl()+theoryHtml(),tasks:()=>dateControl()+tasksHtml(),notes:()=>dateControl()+noteHtml(),formulas:formulasHtml,sync:syncHtml};document.getElementById('app').innerHTML=html[tab]()}
function toggleTask(id,v){state.done[state.date+':'+id]=v;persist();render()}
function toggleAnswer(id){answerVisible[id]=!answerVisible[id];render()}
function addTask(){let q=document.getElementById('newTask').value.trim(),a=document.getElementById('newAnswer').value.trim();if(!q)return toast('Добавь условие');if(!state.customTasks[state.date])state.customTasks[state.date]=[];state.customTasks[state.date].push({id:'custom'+Date.now(),q,a});persist();render();toast('Задача добавлена')}
function deleteTask(id){state.customTasks[state.date]=(state.customTasks[state.date]||[]).filter(x=>x.id!==id);persist();render()}
function saveTheory(){state.customTheory[state.date]=document.getElementById('customTheory').value;persist();toast('План теории сохранён')}
function saveNote(){state.notes[state.date]=document.getElementById('noteText').value;persist();toast('Конспект сохранён')}
function shiftWeek(d){let x=dateOf(state.date);x.setDate(x.getDate()+d);setDate(iso(x))}
function exportData(){let data=JSON.stringify({app:'Подготовка к ШАДу',version:1,exportedAt:new Date().toISOString(),state},null,2);let blob=new Blob([data],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='shad-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);let s=x.state||x;if(!s.done||!s.notes)throw Error('Неверный формат');state={...state,...s};persist();render();toast('Прогресс импортирован')}catch(err){alert('Не удалось прочитать файл прогресса.')}};r.readAsText(f);e.target.value=''}

// Optional cloud sync. Credentials are configured by the user; no service is connected by default.
let cloudClient=null,cloudUser=null,saveTimer=null,cloudBusy=false;
const cloudConfig=()=>{try{return JSON.parse(localStorage.getItem('shad-cloud-config')||'null')}catch(e){return null}};
function syncHtml(){const c=cloudConfig();return `<div class="card"><h2>Синхронизация между устройствами</h2><p class="sub">Прогресс по умолчанию хранится только в твоём браузере. Для синхронизации подключи собственный проект Supabase (бесплатный тариф зависит от условий сервиса). Данные остаются в твоём проекте, а доступ ограничивается аккаунтом через RLS.</p><h3 style="margin-top:20px">1. Настройка сервиса</h3><p class="tiny muted">Впиши Project URL и publishable/anon key из Supabase → Project Settings → API. Не используй secret или service_role key.</p><input class="datebox" id="sbUrl" style="display:block;width:100%;margin:10px 0" placeholder="https://your-project.supabase.co" value="${esc(c?.url||'')}"><input class="datebox" id="sbKey" style="display:block;width:100%;margin:10px 0" placeholder="Publishable / anon key" value="${esc(c?.key||'')}"><div class="buttonrow"><button class="btn primary" onclick="configureCloud()">Сохранить настройки</button><button class="btn" onclick="clearCloud()">Отключить проект</button></div><h3 style="margin-top:24px">2. Вход по электронной почте</h3><input class="datebox" id="sbEmail" type="email" style="display:block;width:100%;margin:10px 0" placeholder="Твоя почта"><div class="buttonrow"><button class="btn primary" onclick="cloudLogin()">Получить ссылку для входа</button><button class="btn" onclick="cloudLogout()">Выйти</button><button class="btn" onclick="updateCloudStatus()">Проверить вход</button></div><p class="sub" id="cloudStatus" style="margin-top:12px">${cloudUser?'Вход выполнен: '+esc(cloudUser.email):'Нет активного облачного сеанса'}</p><h3 style="margin-top:24px">3. Перенести прогресс</h3><p class="sub">Сначала сделай экспорт резервной копии. Кнопка «Загрузить из облака» заменяет локальные отметки и конспекты данными из облака. «Отправить в облако» заменяет облачную копию текущими локальными данными.</p><div class="buttonrow" style="margin-top:14px"><button class="btn" onclick="exportData()">Экспортировать копию</button><button class="btn" onclick="cloudPull()">Загрузить из облака</button><button class="btn primary" onclick="cloudPush(true)">Отправить в облако</button></div><p class="tiny muted" style="margin-top:14px">После успешного входа изменения автоматически отправляются в облако с задержкой. При одновременном редактировании на двух устройствах побеждает последняя сохранённая копия. Не используй одновременно два открытых устройства для редактирования.</p></div>`}
async function configureCloud(){let url=document.getElementById('sbUrl').value.trim().replace(/\/$/,''),key=document.getElementById('sbKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key){alert('Укажи адрес проекта вида https://…supabase.co и publishable/anon key.');return}localStorage.setItem('shad-cloud-config',JSON.stringify({url,key}));cloudClient=null;await initCloud();toast('Настройки сохранены');render()}
function clearCloud(){if(!confirm('Отключить облачный проект на этом устройстве? Локальные данные сохранятся.'))return;cloudClient=null;cloudUser=null;localStorage.removeItem('shad-cloud-config');render()}
async function initCloud(){let c=cloudConfig();if(!c||!window.supabase)return null;try{cloudClient=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let r=await cloudClient.auth.getUser();cloudUser=r.data?.user||null;return cloudClient}catch(e){toast('Ошибка подключения: '+e.message);return null}}
async function updateCloudStatus(){if(!cloudClient)await initCloud();if(!cloudClient)return toast('Сначала настрой проект');let {data,error}=await cloudClient.auth.getUser();cloudUser=data?.user||null;render();if(error)toast(error.message)}
async function cloudLogin(){if(!cloudClient)await initCloud();if(!cloudClient)return toast('Сначала настрой проект');let email=document.getElementById('sbEmail').value.trim();if(!email.includes('@'))return toast('Введи электронную почту');let redirectTo=location.protocol==='https:'?location.origin+location.pathname:undefined;let {error}=await cloudClient.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo}});if(error)alert(error.message);else alert('Проверь почту. Открой ссылку для входа на том же сайте. Если ссылка не пришла, проверь настройки Auth → URL Configuration в Supabase.')}
async function cloudLogout(){if(!cloudClient)await initCloud();if(cloudClient)await cloudClient.auth.signOut();cloudUser=null;render();toast('Выход из облака выполнен')}
function queueCloudSave(){if(!cloudClient||!cloudUser)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>cloudPush(false),1600)}
async function cloudPush(manual){if(cloudBusy)return;if(!cloudClient)await initCloud();if(!cloudClient||!cloudUser){if(manual)toast('Сначала войди в облачный аккаунт');return}if(manual&&!confirm('Заменить облачную копию текущими локальными данными?'))return;cloudBusy=true;let {error}=await cloudClient.from('study_data').upsert({user_id:cloudUser.id,content:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});cloudBusy=false;if(error){toast('Синхронизация: '+error.message)}else if(manual)toast('Прогресс отправлен в облако')}
async function cloudPull(){if(!cloudClient)await initCloud();if(!cloudClient||!cloudUser)return toast('Сначала войди в облачный аккаунт');if(!confirm('Заменить локальный прогресс облачной копией? Сначала рекомендуем экспортировать данные.'))return;let {data,error}=await cloudClient.from('study_data').select('content').eq('user_id',cloudUser.id).maybeSingle();if(error)return toast(error.message);if(!data)return toast('Облачная копия ещё не создана');let s=data.content;if(!s||!s.done||!s.notes)return toast('Некорректные облачные данные');state={...state,...s};localStorage.setItem('shad-2026-v1',JSON.stringify(state));render();toast('Облачная копия загружена')}
window.addEventListener('load',async()=>{if(cloudConfig())await initCloud();if(location.hash.includes('access_token'))history.replaceState({},'',location.pathname+location.search)});
render();
</script></body></html>
